const sceneArt=(i,id="bgg",vb="0 0 360 200")=>(GID=id,`<svg viewBox="${vb}" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false"><defs><radialGradient id="${id}"><stop offset="0" stop-color="#ffd26e" stop-opacity=".95"/><stop offset=".4" stop-color="#ffb43b" stop-opacity=".4"/><stop offset="1" stop-color="#ffb43b" stop-opacity="0"/></radialGradient></defs>${SCN[i]()}</svg>`);
/* pone la escena del bloque i detrás de la pantalla de pregunta (si ya es esa, no la toca); con otro número o sin pregunta, la apaga */
function setScene(i){
  let el=document.getElementById("bgs");
  if(!(i>=0&&i<SCN.length)){if(el)el.classList.remove("on");return}
  if(!el){el=document.createElement("div");el.id="bgs";el.setAttribute("aria-hidden","true");document.body.insertBefore(el,document.body.firstChild)}
  if(el.dataset.i!==String(i)){const b=BLK[i];el.style.cssText=`--cc:${b.c};--ccd:${b.d};--ccl:${b.l}`;el.innerHTML=sceneArt(i);el.dataset.i=i}
  requestAnimationFrame(()=>{el.classList.add("on");sceneFit()})}
/* si el contenido de la pantalla llega hasta abajo (celulares bajitos, preguntas largas o varias pistas) la escena se atenúa para no estorbar la lectura */
function sceneFit(){
  const el=document.getElementById("bgs"),sc=document.querySelector("#app .screen");if(!el||!sc)return;
  const free=innerHeight-(sc.getBoundingClientRect().bottom+(window.scrollY||0));
  el.classList.toggle("dim",free<150)}
addEventListener("resize",()=>{try{sceneFit()}catch(e){}});

/* chispitas de colores al acertar: salen del centro de un botón y se borran solas (con «reducir movimiento» no se muestran) */
function burstAt(el,n=16){
  if(REDUCED||!el||!document.body)return;
  const r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight,dpr=Math.min(2,window.devicePixelRatio||1),c=document.createElement("canvas");
  c.className="confetti";c.setAttribute("aria-hidden","true");c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
  c.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.appendChild(c);const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#ffd466","#ff6b6b","#4388ff","#2fbf7e","#b98af4","#ff9f43","#fff6d6"],ox=r.left+r.width*.5,oy=r.top+r.height*.5;
  const P=Array.from({length:n},()=>({x:ox+(Math.random()-.5)*r.width*.5,y:oy,vx:(Math.random()-.5)*10,vy:-3-Math.random()*6,g:.3+Math.random()*.1,s:4+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.5,c:cols[Math.random()*cols.length|0],ro:Math.random()<.4,t:0}));
  let t0=performance.now();
  (function f(t){
    const dt=Math.min(40,t-t0)/16.7;t0=t;x.clearRect(0,0,W,H);let alive=0;
    for(const p of P){
      p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.r+=p.vr*dt;p.t+=dt;
      const a=Math.max(0,Math.min(1,(52-p.t)/20));
      if(a>0){alive++;x.save();x.globalAlpha=a;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
        if(p.ro){x.beginPath();x.arc(0,0,p.s/2,0,6.283);x.fill()}else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.62);x.restore()}}
    if(alive&&c.isConnected)requestAnimationFrame(f);else c.remove()})(t0)}

/* ============================================================
   COMPAÑEROS · tres personajes dibujados con código (cordero, paloma y leoncito)
   Todo es SVG liviano, sin imágenes y sin degradados: sale igual con o sin internet.
   Cada uno tiene 4 caras: idle (tranquilo), happy (contento), sad (triste) y cheer (festejo).
   Los nombres de este archivo llevan el prefijo mc/MC para no chocar con los demás.
   ============================================================ */
const MC_INK="#3b2a63";
const MCN={lamb:"Lanita",dove:"Paloma",lion:"Leo"}; /* quién es quién */
const MCK=["lamb","dove","lion"];
const mcLn=w=>`stroke="${MC_INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
/* Une varios círculos en una sola silueta con un solo borde: primero se dibujan gruesos y con borde, y encima los mismos sin borde */
const mcBlob=(arr,fill)=>{const c=arr.map(([x,y,r])=>`<circle cx="${+x.toFixed(1)}" cy="${+y.toFixed(1)}" r="${r}"/>`).join("");return`<g fill="${fill}" stroke="${MC_INK}" stroke-width="6.2" stroke-linejoin="round">${c}</g><g fill="${fill}">${c}</g>`};
/* Chispa de 4 puntas (festejo) */
const mcStar=(x,y,s,c)=>`<path d="M${x} ${y-s}Q${x+s*.2} ${y-s*.2} ${x+s} ${y}Q${x+s*.2} ${y+s*.2} ${x} ${y+s}Q${x-s*.2} ${y+s*.2} ${x-s} ${y}Q${x-s*.2} ${y-s*.2} ${x} ${y-s}Z" fill="${c||"#ffd84d"}" stroke="${MC_INK}" stroke-width="1.5" stroke-linejoin="round"/>`;
const mcSpark=k=>(k?mcStar(11,11,7.5)+mcStar(109,10,9):mcStar(12,22,9.5)+mcStar(108,16,11.5))+(k?mcStar(60,6.5,4.5,"#fff3b0"):mcStar(113,47,6,"#fff3b0")+mcStar(8,50,5,"#fff3b0"));
/* Ojos: abiertos con brillo (idle), arcos felices (happy/cheer) o con cejas y lágrima (sad) */
function mcEyes(x,y,sp,m){
  const L=x-sp,R=x+sp;
  if(m==="happy"||m==="cheer")return`<path d="M${L-5.5} ${y+2.5}Q${L} ${y-5.5} ${L+5.5} ${y+2.5}M${R-5.5} ${y+2.5}Q${R} ${y-5.5} ${R+5.5} ${y+2.5}" fill="none" ${mcLn(3.4)}/>`;

  start(s,tick,end){this.stop();this.tot=this.left=s;this.last=performance.now();this.tick=tick;this.end=end;this.id=setInterval(()=>this.step(),100);tick&&tick(this.left,this.tot)},

  add(s){this.left+=s;this.tot=Math.max(this.tot,this.left)},
  stop(){clearInterval(this.id);this.id=0;this.pz=null},
  pause(){if(!this.id)return;const z={l:this.left,t:this.tot,k:this.tick,e:this.end};this.stop();this.pz=z},

function squareJpeg(src,n,q){
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,s=Math.min(w,h),c=document.createElement("canvas");

  i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};i.src=u})}

/* ---------- copia de seguridad: un código con el progreso (sin foto ni clave) ----------
   TBP1z.<datos comprimidos>.<control>   (z = comprimido; u = sin comprimir, si el teléfono no sabe comprimir).
   Al recuperar se valida todo, campo por campo: lo que no es un dato conocido y razonable se descarta. */
const BK_NUM=["pts","streak","best","fixed","rush","games","ok","tot","wins","crowns","perfect","duels","online","combo","cz","arm","armP","ret","kg","lad","wh","whq","tor","torw"];
const bkHash=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36).padStart(7,"0")};
const b64e=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64d=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const bkZip=async(u,Cls)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new Cls("deflate-raw"))).arrayBuffer());
async function bkMake(){
  const o={};BK_NUM.concat(["last","st","pass","name","miss","bk","bq","medals","set","kst"]).forEach(k=>{if(D[k]!==undefined)o[k]=D[k]});
  const json=JSON.stringify(o),raw=new TextEncoder().encode(json);let mode="u",body=raw;
  if(typeof CompressionStream==="function"){try{body=await bkZip(raw,CompressionStream);mode="z"}catch(e){body=raw}}
  return"TBP1"+mode+"."+b64e(body)+"."+bkHash(json)}
function bkClean(o){
  if(!o||typeof o!=="object"||Array.isArray(o))throw Object.assign(new Error("x"),{why:"el código no trae datos de la app"});
  const n=(v,max=1e8)=>Number.isFinite(+v)?Math.max(0,Math.min(max,Math.floor(+v))):0,R=DEF();
  BK_NUM.forEach(k=>R[k]=n(o[k]));R.lad=Math.min(15,R.lad);
  R.last=/^\d{4}-\d{2}-\d{2}$/.test(o.last)?o.last:"";
  R.name=String(o.name||"").replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,14);
  const pairs=(src,keys)=>{const r={};if(src&&typeof src==="object")keys.forEach(k=>{const a=src[k];if(Array.isArray(a))r[k]=[n(a[0],1e6),n(a[1],1e6)]});return r};
  R.st=pairs(o.st,LN);R.bk=pairs(o.bk,["0","1","2","3","4","5"]);
  R.pass=[0,1,2].map(i=>o.pass&&(o.pass[i]===1||o.pass[i]===true)?1:0);
  const ids=new Set(QS.map(q=>q.id));R.miss={};
  if(o.miss&&typeof o.miss==="object")Object.keys(o.miss).filter(k=>ids.has(k)).slice(0,150).forEach(k=>R.miss[k]=n(o.miss[k],4e12));
  R.bq={};if(o.bq&&typeof o.bq==="object"&&!Array.isArray(o.bq))Object.keys(BQS).forEach(k=>{const a=o.bq[k];if(!Array.isArray(a))return;const ok=new Set(BQS[k].map(sid)),ids=[...new Set(a.filter(x=>typeof x==="string"&&ok.has(x)))];if(ids.length)R.bq[k]=ids});
  R.kst=Array.isArray(o.kst)?[...new Set(o.kst.filter(i=>Number.isInteger(i)&&i>=0&&i<KST.length))].sort((a,b)=>a-b):[];
  R.medals={};if(o.medals&&typeof o.medals==="object")MEDALS.forEach(m=>{if(o.medals[m.id])R.medals[m.id]=String(o.medals[m.id]).replace(/[^\d-]/g,"").slice(0,10)});
  const s=o.set&&typeof o.set==="object"?o.set:{};
  R.set={snd:s.snd===0||s.snd===false?0:1,vib:s.vib===0||s.vib===false?0:1,big:s.big===2?2:s.big===1||s.big===true?1:0,tts:s.tts===1||s.tts===true?1:0,vr:s.vr===1||s.vr===true?1:0,kv:s.kv===0||s.kv===false?0:1,fon:s.fon===0||s.fon===false?0:1,theme:["auto","light","dark"].includes(s.theme)?s.theme:"auto",time:[0,15,30].includes(+s.time)?+s.time:15,rv:Object.keys(RVN).includes(s.rv)?s.rv:"bt",mc:["lamb","dove","lion","off"].includes(s.mc)?s.mc:"lamb"};
  return R}
async function bkRead(code){
  const m=String(code||"").match(/TBP1([zu])\.([A-Za-z0-9_\-\s]+)\.([0-9a-z]{7})/);
  if(!m)throw Object.assign(new Error("x"),{why:/TBP1[zu]\./.test(String(code||""))?"el código está incompleto (se cortó al copiarlo)":"no parece un código de la app (tiene que empezar con TBP1)"});
  let body;try{body=b64d(m[2].replace(/\s+/g,""))}catch(e){throw Object.assign(new Error("x"),{why:"el código está dañado"})}
  if(m[1]==="z"){if(typeof DecompressionStream!=="function")throw Object.assign(new Error("x"),{why:"este teléfono no puede abrir códigos comprimidos"});
    try{body=await bkZip(body,DecompressionStream)}catch(e){throw Object.assign(new Error("x"),{why:"el código está incompleto o dañado"})}}
  const json=new TextDecoder().decode(body);
  if(bkHash(json)!==m[3])throw Object.assign(new Error("x"),{why:"el código está incompleto (se cortó al copiarlo)"});
  let o;try{o=JSON.parse(json)}catch(e){throw Object.assign(new Error("x"),{why:"el código está dañado"})}
  return bkClean(o)}

/* ============================================================
   PARTIDA INDIVIDUAL: niveles, rápida, diaria, duelo, contrarreloj,
   repaso de errores, por libro y «solo preguntas» en línea
   ============================================================ */
const MAXQ=10,BOTS=["Mateo","Lidia","Samuel","Rut","Daniel","Débora","Pablo","Ana"];
const MODEN={daily:"⭐ Desafío diario",mix:"🎲 Partida rápida",duel:"⚔️ Duelo",online:"🌍 Con amigos",rush:"⏱️ Contrarreloj",rev:"🔁 Repaso",cloze:"✍️ Completa el versículo",who:"🕵️ Adivina el personaje",reto:"⚔️ Reto",kids:"🧒 Modo niños",lad:"🧗 Escalera de la fe","0":"🌱 Fácil","1":"📖 Intermedio","2":"🔥 Difícil"};
const modeLabel=g=>g.mode==="book"?"📖 "+g.book:MODEN[g.mode];
const missed=()=>QS.filter(q=>D.miss[q.id]);
const booksQ=k=>BQS[k]||[];
/* a practicar un libro: primero las preguntas que todavía no acertaste (así las estrellas suben más rápido) */
function startBook(k){const s=new Set((D.bq&&D.bq[k])||[]),qs=booksQ(k);startGame([...shuffle(qs.filter(q=>!s.has(sid(q)))),...shuffle(qs.filter(q=>s.has(sid(q))))],"book",{book:k})}
let lastSec=0;

function logAnswer(q,good){
  if(good&&!q.cz&&!q.who)bqMark(q);
  D.tot++;if(good)D.ok++;const bk=D.bk[q.b]||[0,0];bk[1]++;if(good)bk[0]++;D.bk[q.b]=bk;const c=LN[q.l],s=D.st[c]||[0,0];s[1]++;if(good)s[0]++;D.st[c]=s;
  if(q.cz&&good)D.cz=(D.cz||0)+1; /* «Completa el versículo» no entra en el repaso de errores */
  if(q.who&&good){D.wh=(D.wh||0)+1;if(G&&G.wn<=2)D.whq=(D.whq||0)+1} /* «Adivina el personaje» tampoco */
  if(good){if(D.miss[q.id]){delete D.miss[q.id];D.fixed=(D.fixed||0)+1}}
  else if(!q.cz&&!q.who){D.miss[q.id]=Date.now();const ks=Object.keys(D.miss);if(ks.length>150)ks.sort((a,b)=>D.miss[a]-D.miss[b]).slice(0,ks.length-150).forEach(k=>delete D.miss[k])}}
function ringTick(l,t){const pg=$("#pg"),r=$("#ring");if(!pg)return;pg.style.strokeDashoffset=(100.53*(1-l/t)).toFixed(2);const sg=Math.ceil(l),rn=$("#rn");if(rn&&rn.dataset.s!==String(sg)){rn.dataset.s=sg;rn.textContent=sg} /* el número se toca solo cuando cambia de segundo */
  const w=l<=5&&l>0;r.classList.toggle("warn",w);if(w&&Math.ceil(l)!==lastSec){lastSec=Math.ceil(l);Snd.play("time")}}
function rushTick(l,t){const b=$("#gbar"),g=$("#gtime"),r=$(".rbar");if(b)b.style.width=Math.max(0,l/t*100).toFixed(1)+"%";if(g)g.textContent=Math.ceil(l);if(r){r.classList.toggle("warn",l<=10);if(l<=5&&l>0&&Math.ceil(l)!==lastSec){lastSec=Math.ceil(l);Snd.play("time")}}}
function rushEnd(){if(!G||G.over)return;G.over=1;clearTimeout(G.adv);Tm.stop();endGame()}
function showSheet({good,title,q,btn,btnCls,wait,next,kid,auto,note}){ /* auto: undefined = lo normal (leer el versículo si está activado); un texto = leerlo; false = no leer nada */
  document.body.classList.add("sheeted");
  const el=document.createElement("div");el.className="sheet "+(good?"ok":"bad")+(kid?" kid":"");el.setAttribute("role","status");
  const mc=mcHTML(good?(kid?"cheer":"happy"):(kid?"idle":"sad"),"sh "+(good?"hop":"sag")); /* el compañero (si lo hay) se alegra o se apena al lado del título */
  el.innerHTML=`<div>${mc?'<div class="shh"><div class="shm">':""}<h3>${title}</h3>${note?`<p class="lnote">${note}</p>`:""}${good||!q?"":`<p class="ans">Respuesta correcta: <b>${q.a}</b></p>`}${mc?`</div>${mc}</div>`:""}${q?verseHTML(q):""}${btn?`<button class="btn ${btnCls||"blue"}" id="nx">${btn}</button>`:`<p class="sub" style="margin:.2rem 0 0">${wait||""}</p>`}</div>`;
  document.body.appendChild(el);
  const vb=$(".vsh",el);if(vb&&q){const v=verseInfo(q);vb.onclick=()=>shareVerse(v.label,v.text)}
  const rb=$(".vrv",el);if(rb&&q){const v=verseInfo(q);rb.onclick=()=>rvrRead(q.r,v.label)}
  const sp=$(".vsp",el);if(sp&&q){const v=verseInfo(q),tx=ttsVerse(v.label,v.text);sp.onclick=()=>Tts.toggle(tx,sp,kid?kidVoice():undefined);if(auto===undefined&&D.set.tts)setTimeout(()=>{if(el.isConnected)Tts.say(tx,sp)},350)}
  if(auto&&Tts.ok)setTimeout(()=>{if(el.isConnected)Tts.say(auto,null,kidVoice())},250);
  const b=$("#nx");if(b){b.onclick=()=>{b.disabled=true;next&&next()};b.focus({preventScroll:true})}
  setTimeout(()=>{const ok=$(".opt.ok"),sh=$(".sheet>div");if(ok&&sh){const r=ok.getBoundingClientRect(),s=sh.getBoundingClientRect();if(r.bottom>s.top-10)window.scrollBy({top:r.bottom-s.top+18,behavior:REDUCED?"auto":"smooth"})}},60)}

/* ---------- versículo como imagen (para WhatsApp, estados, etc.) ---------- */
function wrapText(x,t,maxW){const w=t.split(/\s+/),L=[];let cur="";for(const word of w){const test=cur?cur+" "+word:word;if(x.measureText(test).width>maxW&&cur){L.push(cur);cur=word}else cur=test}if(cur)L.push(cur);return L}
function wheelMini(x,cx,cy,r){x.save();x.translate(cx,cy);x.beginPath();x.arc(0,0,r+7,0,6.2832);x.fillStyle="#e8a317";x.fill();
  for(let i=0;i<6;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,r,(i*60-90)*Math.PI/180,((i+1)*60-90)*Math.PI/180);x.closePath();x.fillStyle=BLK[i].c;x.fill();x.strokeStyle="#fff";x.lineWidth=2.5;x.stroke()}
  x.beginPath();x.arc(0,0,r*.3,0,6.2832);x.fillStyle="#fff6d6";x.fill();x.restore()}
/* fondo de las tarjetas para compartir: azul con degradé, cruces suaves y doble marco dorado. Devuelve rr(x,y,ancho,alto,radio) para dibujar rectángulos redondeados */
function cardBg(x,W,H){
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1c3d95");g.addColorStop(.5,"#0f1d4d");g.addColorStop(1,"#070e26");x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W/2,300,10,W/2,300,820);g.addColorStop(0,"rgba(246,195,80,.22)");g.addColorStop(1,"rgba(246,195,80,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="rgba(255,255,255,.045)";x.lineWidth=5;x.lineCap="round";
  for(let i=0;i<W;i+=130)for(let j=0;j<H;j+=130){const cx=i+65,cy=j+65;x.beginPath();x.moveTo(cx,cy-16);x.lineTo(cx,cy+16);x.moveTo(cx-16,cy);x.lineTo(cx+16,cy);x.stroke()}
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
  x.strokeStyle="#f6c350";x.lineWidth=6;rr(44,44,W-88,H-88,44);x.stroke();
  x.strokeStyle="rgba(246,195,80,.4)";x.lineWidth=2;rr(68,68,W-136,H-136,32);x.stroke();
  return rr}
function verseCanvas(label,text){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const SER='"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif","Book Antiqua",Georgia,serif',SANS='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  cardBg(x,W,H);
  x.fillStyle="#f6c350";x.fillRect(W/2-9,150,18,84);x.fillRect(W/2-34,172,68,18);x.fillRect(W/2-250,196,190,3);x.fillRect(W/2+60,196,190,3);
  x.textAlign="center";x.textBaseline="alphabetic";
  const t="«"+text+"»";let size=72,lines=[];
  for(;size>=34;size-=2){x.font=`italic 600 ${size}px ${SER}`;lines=wrapText(x,t,800);if(lines.length*size*1.38<=680)break}
  const lh=size*1.38,top=625-lines.length*lh/2+size*.9;
  x.fillStyle="#fff4d6";lines.forEach((l,i)=>x.fillText(l,W/2,top+i*lh));
  const ry=Math.min(1050,top+lines.length*lh+58);
  x.fillStyle="#f6c350";x.font=`bold 50px ${SANS}`;x.fillText(label,W/2,ry);
  x.fillStyle="rgba(255,244,214,.7)";x.font=`500 30px ${SANS}`;x.fillText("Reina-Valera 1909",W/2,ry+50);
  const cx=W/2-190,cy=1190;wheelMini(x,cx,cy,40);x.textAlign="left";x.fillStyle="#f6c350";x.font=`bold 52px ${SER}`;x.fillText("Trivia Bíblica",cx+66,cy+18);

/* ---------- Arma el versículo: se reconstruye un versículo exacto (RV 1909) tocando las palabras en orden ----------
   Sirve para memorizar. Se muestra la cita y el versículo con huecos; abajo están las palabras que faltan, mezcladas, y hay que
   tocarlas en el orden correcto (una palabra equivocada resta puntos; «Pista» pone la siguiente). Tres niveles: en el Fácil ya están
   puestas más de la mitad de las palabras, en el Medio un cuarto y en el Difícil ninguna (con versículos más cortos). Cinco versículos

const AR_N=5,AR_LV=[{g:.55,w:[8,24]},{g:.25,w:[8,20]},{g:0,w:[6,15]}];
const AR_DESC=["Más de la mitad de las palabras ya están puestas","Solo la primera palabra y unas pocas más","Sin ayuda: armas todo desde cero (versículos más cortos)"];
const AR_LET=/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/;

function arInit(){

function arPool(lv,n=AR_N){ /* n versículos distintos, a lo sumo 2 por libro (si no alcanzan, se completa) */

  const ag=$("#again");if(ag)ag.onclick=()=>{const m=g.mode;

    else startGame(pool(+m),m)};

/* ---------- Escalera de la fe (v4.1) ----------
   15 peldaños de toda la Biblia: 5 fáciles, 5 intermedios y 5 difíciles. Cada peldaño vale más (LADV) y los puntos que tienes son los del último peldaño que subiste.
   Seguros en el peldaño 5 y en el 10: si fallas o se acaba el tiempo, te quedas con el último seguro que pasaste.
   Antes de cada pregunta (desde la 2.ª) puedes retirarte y llevarte tus puntos.
   Ayudas, una vez cada una: 50/50, 👥 Público (porcentajes) y Cambiar (otra pregunta del mismo nivel, ya apartada en G.sp).
   Reloj: 30 s por pregunta, o sin reloj si en Ajustes está «Sin tiempo». D.lad = mejor peldaño alcanzado (0 a 15). G.how: "top" · "fall" · "retire". */
const LADV=[50,100,150,200,300,400,500,650,800,1000,1250,1500,2000,2500,3000],LADN=15;
const ladSafe=k=>k>=10?LADV[9]:k>=5?LADV[4]:0; /* puntos que te quedan si fallas en el peldaño k (0 = el primero) */
const LAD_RULES=`<h3>🧗 Escalera de la fe</h3><p>Sube <b>15 peldaños</b>: 5 fáciles, 5 intermedios y 5 difíciles. Cada uno vale más puntos.</p><p>🛡️ En los peldaños <b>5 y 10</b> hay un <b>seguro</b>: si fallas, te quedas con el último que pasaste.</p><p>💰 Puedes <b>retirarte</b> antes de una pregunta y llevarte tus puntos.</p><p>💡 Tienes 3 ayudas, una de cada una: <b>50/50</b>, <b>👥 Público</b> y <b>Cambiar</b>.</p>`;
function startLadder(){
  const qs=[],sp=[];
  [0,1,2].forEach(l=>{const p=shuffle(QS.filter(q=>q.l===l));qs.push(...p.slice(0,5));sp.push(...p.slice(5,10))});
  startGame(qs,"lad",{sp,how:""})}
function ladGo(){ /* la primera vez explica las reglas */
  if(D.lai){startLadder();return}
  modal(LAD_RULES,[{t:"Volver",cls:"ghost"},{t:"¡A subir!",cls:"gold",fn:()=>{D.lai=1;sv();startLadder()}}])}
const ladBar=()=>{const k=G.i,s=ladSafe(k);
  return`<div class="ladbar" role="group" aria-label="Peldaño ${k+1} de ${G.n}. Esta pregunta vale ${LADV[k]} puntos. ${s?"Si fallas te quedas con "+s+" puntos.":"Si fallas no te quedas con puntos."}"><span>🧗 Peldaño ${k+1} de ${G.n}</span><span class="lv">Vale ${LADV[k]} pts</span><span class="sf">🛡️ Seguro: ${s}</span></div>`};
function ladPoll(){ /* 👥 Público: porcentajes entre las respuestas que quedan (suman 100); el público acierta más en lo fácil y menos en lo difícil */
  const live=G.o.map((_,x)=>x).filter(x=>!G.gone.includes(x)),c=G.o.indexOf(G.q.a),n=live.length;
  const base=[.8,.6,.42][G.q.l]+(n<=2?.2:0),cs=Math.max(.3,Math.min(.95,base+(Math.random()-.5)*.16));
  const wr=live.filter(x=>x!==c),w=wr.map(()=>.35+Math.random()),sw=w.reduce((s,v)=>s+v,0);
  const top=Math.round(cs*100),rest=100-top,pc=w.map(v=>Math.floor(rest*v/sw));
  for(let j=0,left=rest-pc.reduce((s,v)=>s+v,0);left>0;j=(j+1)%pc.length,left--)pc[j]++;
  const out={};out[c]=top;wr.forEach((x,j)=>out[x]=pc[j]);
  live.forEach(x=>{const o=$$(".opt")[x];if(o&&!$(".pc",o)){const e=document.createElement("b");e.className="pc";e.textContent=out[x]+"%";o.appendChild(e)}});
  G.poll=out}
function ladPick(good,i,q){
  const k=G.i,top=k>=G.n-1,rb=$("#ret");if(rb)rb.disabled=true;
  G.res[k]=good?1:0;logAnswer(q,good);
  let title,note="",btn="Ver resultado";
  if(good){
    G.combo++;G.best=Math.max(G.best,G.combo);D.combo=Math.max(D.combo||0,G.combo);G.ok++;G.pts=LADV[k];Snd.play("ok");vib(30);
    title=`¡Correcto! <b>${LADV[k]} pts</b>`;
    if(top){G.how="top";note="🏔️ ¡Llegaste a la cima de la escalera!"}
    else{btn="Siguiente peldaño";if(k===4)note="🛡️ ¡Primer seguro! Aunque falles, te quedas con "+LADV[4]+" pts";else if(k===9)note="🛡️ ¡Segundo seguro! Ya tienes "+LADV[9]+" pts a salvo"}
  }else{
    G.combo=0;G.how="fall";G.pts=ladSafe(k);Snd.play("bad");vib([60,40,60]);
    title=i<0?"¡Se acabó el tiempo!":"Incorrecto";
    note=G.pts?"🛡️ Te quedas con "+G.pts+" pts (tu último seguro)":"Esta vez no quedan puntos a salvo. ¡Vuelve a subir!"}
  const sc=$("#sc");if(sc)sc.textContent="⭐ "+G.pts;
  showSheet({good,q,title,note,btn,btnCls:good?"green":"blue",next:()=>{if(good&&!top){G.i++;ask()}else endGame()}})}
function ladRetire(){
  if(!G||G.mode!=="lad"||G.done||G.over||G.i<1)return;
  Tm.pause();Tts.stop();
  const s=ladSafe(G.i);
  modal(`<h3>💰 ¿Retirarte ahora?</h3><p>Te llevas <b>${G.pts} puntos</b> y termina la partida. Si sigues y fallas, ${s?"te quedas con "+s+" (tu seguro)":"te quedas sin puntos"}.</p>`,
    [{t:"Seguir jugando",cls:"green"},{t:"Retirarme con "+G.pts,cls:"gold",fn:()=>{G.done=1;G.over=1;G.how="retire";endGame()}}],"col")}
const ladMsg=g=>g.how==="top"?"¡Llegaste a la cima! Eres un erudito de la fe.":g.how==="retire"?"Te retiraste a tiempo y te llevas tus puntos.":g.pts>=LADV[9]?"¡Casi llegas! El segundo seguro te dejó "+g.pts+" pts.":g.pts>=LADV[4]?"Te caíste, pero el primer seguro te dejó "+g.pts+" pts.":"Te caíste en los primeros peldaños. ¡Vuelve a subir!";

/* ---------- Reta a un amigo con un enlace (sin servidor) ----------
   Las 10 preguntas salen de un número («semilla») con el que se mezcla el banco: quien abre el enlace recibe las MISMAS 10, en el mismo orden.
   El enlace lleva la semilla, el nombre y el puntaje del retador, y la versión de las preguntas (NETV). Todo se valida antes de usarlo.
   Reto: 15 s por pregunta y sin comodines para los dos, así los puntos se pueden comparar. */
const retoQs=seed=>shuffle(QS,rng((parseInt(seed,36)||1)^0x5bd1e995));
const retoSeed=()=>{let s;do{s=(Math.floor(Math.random()*1e9)+1e5).toString(36)}while(!/^[0-9a-z]{3,8}$/.test(s));return s};
const retoGet=seed=>(D.rts||[]).find(x=>x[0]===seed); /* retos que ya jugaste: [semilla, puntos, 1 si lo armaste tú] (los últimos 40) */
function retoSaved(seed,pts,own){if(!Array.isArray(D.rts))D.rts=[];if(!retoGet(seed))D.rts.push([seed,pts,own?1:0]);while(D.rts.length>40)D.rts.shift()}
function startReto(){const seed=retoSeed();startGame(retoQs(seed),"reto",{seed})}
function retoMenu(){ /* la primera vez se explica cómo funciona */
  Snd.play("click");if(D.rti){startReto();return}
  modal(`<h3>📨 Reta a un amigo</h3><p>Respondes 10 preguntas (15 segundos cada una, sin comodines). Al terminar te damos un <b>enlace</b>: se lo mandas a tu amigo por WhatsApp y él juega <b>las mismas 10 preguntas</b>. Gana quien saque más puntos.</p>`,
    [{t:"Cancelar",cls:"ghost"},{t:"¡Vamos!",cls:"gold",fn:()=>{D.rti=1;sv();startReto()}}])}
function retoLink(g){return`${APPURL}#reto=${g.seed}&de=${encodeURIComponent((D.name||"").trim()||"Un amigo")}&p=${g.pts}&a=${g.ok}&v=${NETV}`}
function retoShare(g){shareTxt(`⚔️ ¡Te reto en Trivia Bíblica! Respondí 10 preguntas y saqué ${g.pts} puntos (${g.ok}/10). ¿Puedes superarme?`,retoLink(g))}
function retoReply(g){const r=g.rival,w=g.pts>r.p,t=g.pts===r.p;
  return`⚔️ Acepté tu reto en Trivia Bíblica: yo ${g.pts} puntos (${g.ok}/10) y tú ${r.p} (${r.a}/10). ${w?"¡Te gané! 😄":t?"¡Empatamos! 🤝":"¡Ganaste tú! 👏"} ¿Revancha?\n${APPURL}`}
function retoOpen(p){ /* p: los datos del enlace (URLSearchParams); se limpian antes de mostrar nada */
  const seed=String(p.get("reto")||"").toLowerCase(),v=String(p.get("v")||"").slice(0,20);
  if(!/^[0-9a-z]{3,8}$/.test(seed)){toast("El enlace del reto no es válido");return}
  const nm=String(p.get("de")||"").replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,14)||"Un amigo";
  const num=(k,max)=>{const n=parseInt(p.get(k),10);return Number.isFinite(n)?Math.max(0,Math.min(max,n)):0};
  const rival={n:nm,p:num("p",2000),a:num("a",10)};
  if(v!==NETV)return modal(`<h3>⚔️ Reto de otra versión</h3><p>El reto de <b>${esc(nm)}</b> se armó con otra versión de las preguntas${v?" ("+esc(v)+")":""} y esta app tiene la ${NETV}. Para jugarlo, los dos tienen que tener la app actualizada: cierra la app y ábrela dos veces. Después toca el enlace otra vez.</p>`,[{t:"Entendido",cls:"gold"}]);
  const done=retoGet(seed);
  if(done){const mine=done[1];
    return modal(`<h3>⚔️ Ya jugaste este reto</h3><p>${done[2]?`Este reto lo armaste tú: sacaste <b>${mine} puntos</b>. Mándaselo a un amigo desde la pantalla de resultado.`
      :`Sacaste <b>${mine} puntos</b> y ${mine>rival.p?"le ganaste a":mine===rival.p?"empataste con":"perdiste contra"} <b>${esc(nm)}</b> (${rival.p}). Cada reto se juega una sola vez; si quieres revancha, arma uno nuevo.`}</p>`,[{t:"Cerrar",cls:"ghost"},{t:"Nuevo reto",cls:"gold",fn:startReto}])}
  modal(`<h3>⚔️ ${esc(nm)} te retó</h3><p>Respondió las mismas 10 preguntas y sacó <b>${rival.p} puntos</b> (${rival.a}/10 correctas). ¿Puedes superarlo?</p><p class="sub" style="margin:0;text-align:left">15 segundos por pregunta y sin comodines.</p>`,
    [{t:"Ahora no",cls:"ghost"},{t:"¡Acepto!",cls:"gold",fn:()=>startGame(retoQs(seed),"reto",{seed,rival})}])}


/* ============================================================
   RULETA DE CORONAS
   Un solo motor para partida local y en línea: todo cambio de estado
   es un evento (s=giro, c=elige bloque, a=respuesta, n=continuar).
   En línea, cada jugador publica sus eventos y los demás los repiten.
   ============================================================ */
const PCOL=["#3e82f7","#e5484d","#2fbf7e","#9b5de5"];
const TMN=["🔵 Equipo azul","🔴 Equipo rojo"]; /* ruleta por equipos: cada equipo comparte sus coronas y sus jugadores se turnan */
let EV=[];
function wheelSVG(){
  let s=`<svg class="wheel" id="wsvg" viewBox="-122 -134 244 256" role="img" aria-label="Ruleta con los seis bloques de la Biblia"><defs><radialGradient id="sh" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe28f"/><stop offset=".5" stop-color="#e49b12"/><stop offset="1" stop-color="#8a5a06"/></linearGradient></defs><circle r="119" fill="url(#rim)"/><circle r="109" fill="#2a1a00" opacity=".55"/>`;
  for(let i=0;i<16;i++){const a=i*22.5*Math.PI/180;s+=`<circle class="bulb ${i%2?"b2":""}" cx="${(114*Math.cos(a)).toFixed(1)}" cy="${(114*Math.sin(a)).toFixed(1)}" r="2.7" fill="#fff6cc"/>`}
  s+='<g id="wh">';
  for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180,b=((i+1)*60-90)*Math.PI/180,m=(a+b)/2,x=68*Math.cos(m),y=68*Math.sin(m);
    s+=`<path d="M0 0L${(105*Math.cos(a)).toFixed(2)} ${(105*Math.sin(a)).toFixed(2)}A105 105 0 0 1 ${(105*Math.cos(b)).toFixed(2)} ${(105*Math.sin(b)).toFixed(2)}Z" fill="${BLK[i].c}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=`<text x="${x.toFixed(1)}" y="${(y+10).toFixed(1)}" font-size="30" text-anchor="middle" transform="rotate(${i*60+30} ${x.toFixed(1)} ${y.toFixed(1)})">${BLK[i].e}</text>`}
  s+='<circle r="105" fill="url(#sh)"/></g>';
  s+='<circle r="24" fill="url(#rim)" stroke="#fff" stroke-width="2"/><circle r="18" fill="#fff6d6"/><path d="M-2.6-11h5.2v6.2h6.2v5.2h-6.2v9.6h-5.2v-9.6h-6.2v-5.2h6.2z" fill="#7a4a00"/>';
  s+='<g id="ptr"><path d="M-12-127L12-127L0-96Z" fill="#fff" stroke="#7a4a00" stroke-width="3" stroke-linejoin="round"/><circle cy="-119" r="3.2" fill="#d93a40"/></g></svg>';
  return s}
function spinWheel(idx,done){
  const g=$("#wh"),ptr=$("#ptr"),box=$(".wheelbox");let fin=0;
  const dur=REDUCED?700:3400,th=360*5-(idx*60+30+(Math.random()-.5)*34),T0=performance.now();let lastK=0;
  const end=()=>{if(fin)return;fin=1;if(g)g.setAttribute("transform","rotate("+th.toFixed(2)+")");if(box)box.classList.remove("spinning");done()};
  if(!g){end();return}
  if(box)box.classList.add("spinning");
  (function f(now){const p=Math.min(1,(now-T0)/dur),a=th*(1-Math.pow(1-p,4));g.setAttribute("transform","rotate("+a.toFixed(2)+")");
    const k=Math.floor(a/60);if(k!==lastK){lastK=k;if(!REDUCED){Snd.play("tick");if(ptr){ptr.setAttribute("transform","rotate(-16 0 -127)");setTimeout(()=>ptr.removeAttribute("transform"),70)}}}
    if(p<1&&!fin)requestAnimationFrame(f);else end()})(T0);
  setTimeout(end,dur+300)}

const crownsHTML=(n,w)=>"👑".repeat(n)+(w>n?`<span class="off">${"👑".repeat(w-n)}</span>`:"");
const rBar=()=>`<div class="gtop"><button class="ibtn" id="ex" aria-label="Salir de la partida">✕</button><div class="ttl">🎡 Ruleta de coronas</div>${R.on?rxBtn()+chBtn():'<span style="width:2.75rem"></span>'}</div>`;

function rSetup(){

  const seen=new Set(),a=[];
  (Array.isArray(D.fr)?D.fr:[]).forEach(f=>{if(f&&fcOk(f.i)&&f.i!==D.fid&&!seen.has(f.i)&&a.length<FRMAX){seen.add(f.i);a.push({i:f.i,n:nmClean(f.n)||"Amigo",t:Number.isFinite(+f.t)?+f.t:0})}});
  D.fr=a;D.fsh=Number.isFinite(+D.fsh)&&+D.fsh>0?+D.fsh:0})();

/* ---------- mi código y mi presencia ---------- */
function frEnsure(){
  if(!fcOk(D.fid)){
    let c="";try{for(const x of crypto.getRandomValues(new Uint8Array(8)))c+=FRA[x%FRA.length]}catch(e){c="";for(let i=0;i<8;i++)c+=FRA[Math.random()*FRA.length|0]}
    D.fid=c;sv();frHas=0;frQuiet=0;
    if(frBeatT){frBeat();frPoll()}}
  frStart();return D.fid}
function frStart(){
  if(frBeatT||!fcOk(D.fid))return;
  frBeatT=setInterval(frBeat,window.__TB_FRBEAT||30000);frPollT=setInterval(frPoll,window.__TB_FRPOLL||10000);
  frBeat();frPoll()}
async function frBeat(){
  if(!fcOk(D.fid)||document.hidden)return;
  const on=D.set.fon===0?0:1;
  if(!on&&frQuiet)return;frQuiet=on?0:1; /* sin «en línea»: se avisa una sola vez que estoy oculto */
  try{
    const r=await fetch(frUrl("pr-"+D.fid,D.fid),{method:"PUT",body:JSON.stringify({n:nmClean(D.name)||"Amigo",t:{".sv":"timestamp"},o:on,h:on?0:1,r:RM?1:0})});
    if(!r.ok)return;const j=await r.json().catch(()=>null);frHas=1;
    if(j&&typeof j.t==="number")frOff=j.t-Date.now();else frClock()
  }catch(e){}}
async function frClock(){try{const r=await fetch(frUrl("pr-"+D.fid,D.fid)),j=await r.json();if(j&&typeof j.t==="number")frOff=j.t-Date.now()}catch(e){}}
function frOffline(){if(!fcOk(D.fid))return;frQuiet=0;try{fetch(frUrl("pr-"+D.fid,D.fid),{method:"PATCH",body:JSON.stringify({o:0,r:0,t:{".sv":"timestamp"}}),keepalive:true}).catch(()=>{})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!fcOk(D.fid))return;if(document.hidden)frOffline();else{frBeat();frPoll()}});
addEventListener("pagehide",frOffline);
function frReset(old){ /* «Borrar mi progreso»: también se borra lo de amigos de este celular */
  [INVS,REQS,FST,FSHOWN].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));FDIS.clear();frHas=0;frQuiet=0;frOff=0;
  if(fcOk(old)){try{fetch(frUrl("pr-"+old,old),{method:"DELETE"}).catch(()=>{})}catch(e){}}
  const b=$("#invb");if(b)b.remove()}

/* ---------- el buzón: invitaciones y pedidos de amistad ---------- */
async function frPoll(){
  if(!fcOk(D.fid)||document.hidden||frBusy)return;frBusy=1;
  try{if(!frHas)await frBeat();const r=await fetch(frUrl("fr-"+D.fid));if(r.ok){const d=await r.json();frIn(d&&typeof d==="object"?d:{})}}catch(e){console.error(e)}
  frBusy=0}
function frIn(d){
  const now=frNow(),R2={},I2={};let fresh=0,auto=0;
  Object.keys(d).forEach(k=>{
    const v=d[k],m=/^([a-hj-km-np-z2-9]{8})-([if])$/.exec(k),del=()=>{fetch(frUrl("fr-"+D.fid,k),{method:"DELETE"}).catch(()=>{})};
    if(!m||!v||typeof v!=="object"){del();return}
    const c=m[1],kind=m[2],t=+v.t||0;
    if(v.c!==c||t<=0||now-t>(kind==="i"?INVTTL:REQTTL)){del();return} /* vencida o rara: se borra */
    const n=nmClean(v.n)||"Amigo",id=k+":"+t;
    if(FDIS.has(id))return;
    let isF=D.fr.some(f=>f.i===c);
    if(!isF&&D.fsh&&Date.now()-D.fsh<864e5&&frAdd(c,n)){isF=true;auto=n} /* compartí mi enlace o mi código hace poco: se acepta solo */
    if(kind==="f"){
      if(isF){del();FDIS.add(id);return}
      R2[k]=REQS[k]&&REQS[k].id===id?REQS[k]:(fresh=1,{id,k,c,n,t});return}
    const s=String(v.s||""),p=String(v.p||"");
    if(!/^[a-z0-9]{1,20}$/.test(s)||!p||p.length>20){del();return}
    if(!isF){R2[k]=REQS[k]&&REQS[k].id===id?REQS[k]:(fresh=1,{id,k,c,n,t,i:1});return} /* todavía no es amigo: se ve como pedido y la invitación espera */
    I2[k]=INVS[k]&&INVS[k].id===id?INVS[k]:(fresh=1,{id,k,c,n,s,p,m:["q","r","t","w"].includes(v.m)?v.m:"q",t})});
  const same=(a,b)=>{const x=Object.keys(a),y=Object.keys(b);return x.length===y.length&&x.every(k=>a[k]===b[k])};
  const ch=!same(R2,REQS)||!same(I2,INVS)||auto;
  [[REQS,R2],[INVS,I2]].forEach(([o,n])=>{Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n)});
  if(auto)toast("¡"+esc(auto)+" ahora es tu amigo! 🎉");
  if(fresh||auto)Snd.play("ok");
  if(ch){frPaint();frListPaint()}}
async function frStatusAll(){
  if(!D.fr.length)return;let ch=0;
  if(!frHas)await frBeat();
  await Promise.all(D.fr.map(async f=>{
    try{const r=await fetch(frUrl("pr-"+f.i));if(!r.ok)return;const j=await r.json(),v=j&&j[f.i];
      if(v&&typeof v==="object"){FST[f.i]={n:nmClean(v.n),t:+v.t||0,o:v.o?1:0,h:v.h?1:0,r:v.r?1:0};const n=FST[f.i].n;if(n&&n!==f.n){f.n=n;ch=1}}}catch(e){}}));
  if(ch)sv()}
const frOn=f=>{const s=FST[f.i];return!!(s&&s.o&&frNow()-s.t<ONLMS)};

/* ---------- amigos: agregar, quitar, mandar ---------- */
function frAdd(c,n){
  if(!fcOk(c)||c===D.fid)return false;
  if(D.fr.some(f=>f.i===c))return true;
  if(D.fr.length>=FRMAX){toast("Llegaste al máximo de "+FRMAX+" amigos");return false}
  D.fr.push({i:c,n:nmClean(n)||"Amigo",t:Date.now()});sv();return true}
function frDel(c){D.fr=D.fr.filter(f=>f.i!==c);delete FST[c];sv()}
async function frSend(c,kind,extra){
  if(!fcOk(c))return false;frEnsure();
  try{const r=await fetch(frUrl("fr-"+c,D.fid+"-"+kind),{method:"PUT",body:JSON.stringify(Object.assign({k:kind,c:D.fid,n:nmClean(D.name)||"Amigo",t:{".sv":"timestamp"}},extra||{}))});return r.ok}catch(e){return false}}
const frLink=()=>`${APPURL}#amigo=${D.fid}&n=${encodeURIComponent(nmClean(D.name)||"Amigo")}`;
function frShare(){frEnsure();D.fsh=Date.now();sv();shareTxt(`👥 ¡Agrégame como amigo en Trivia Bíblica!\nMi código: ${fcFmt(D.fid)}\n${frLink()}`)}
function frCopy(){frEnsure();D.fsh=Date.now();sv();const c=fcFmt(D.fid);(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast("Código copiado ✓"),()=>toast("Anota tu código: "+c,{ms:6000}))}
function reqAccept(r){
  if(!frAdd(r.c,r.n))return;delete REQS[r.k];
  if(r.i)setTimeout(frPoll,50); /* la invitación que venía con el pedido ahora sí cuenta */
  else{FDIS.add(r.id);fetch(frUrl("fr-"+D.fid,r.k),{method:"DELETE"}).catch(()=>{})}
  toast("¡"+esc(r.n)+" ahora es tu amigo! 🎉");frPaint();frListPaint();frStatusAll().then(frListPaint)}
function reqIgnore(r){delete REQS[r.k];FDIS.add(r.id);fetch(frUrl("fr-"+D.fid,r.k),{method:"DELETE"}).catch(()=>{});frPaint();frListPaint()}
function invDrop(v){delete INVS[v.k];FDIS.add(v.id);fetch(frUrl("fr-"+D.fid,v.k),{method:"DELETE"}).catch(()=>{});frPaint();frListPaint()}

  try{
    const b=$("#invb"),now=Date.now(),nq=Object.keys(REQS).length,ni=Object.keys(INVS).length;
    const items=[...Object.values(REQS).map(x=>({r:1,x})),...Object.values(INVS).map(x=>({r:0,x}))].filter(o=>!FSHOWN[o.x.id]||now-FSHOWN[o.x.id]<30000);

function frListPaint(){const a=$("#frl"),b=$("#frs");if(a)a.innerHTML=frListHTML(0);if(b)b.innerHTML=frListHTML(1)}
function frListBind(root){root.onclick=e=>{
  const b=e.target.closest("button");if(!b||!root.contains(b))return;const c=b.dataset.c,k=b.dataset.k,has=n=>b.classList.contains(n);
  if(has("fin"))frInvite(c,b);

/* ============================================================
   CHAT DE LA SALA
   ============================================================ */
const CHQ=["¿Listos?","¡Vamos!","Buena partida 👏","Dios te bendiga 🙏","Un momento…","¡Qué difícil! 😅"],CHEMPTY='<p class="chempty">Nadie escribió todavía. ¡Saluda! 👋</p>';
const CH={log:[],keys:new Set(),my:[],seq:0,init:0,unread:0,last:0,mounts:[]};
const chText=x=>String(x==null?"":x).replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,120);
const chBtn=()=>'<button type="button" class="ibtn chb" aria-label="Abrir el chat de la sala">💬<i class="bdg" hidden></i></button>';
const chRes=()=>'<button type="button" class="btn ghost chb" id="chr">💬 Chat de la sala<i class="bdg" hidden></i></button>';
const chSort=()=>CH.log.sort((a,b)=>a.s-b.s||(a.pid<b.pid?-1:a.pid>b.pid?1:0));
function chReset(){CH.log=[];CH.keys=new Set();CH.my=[];CH.seq=0;CH.init=0;CH.unread=0;CH.mounts=[];["chp","chov"].forEach(i=>{const e=$("#"+i);if(e)e.remove()});chBadge()}
function chSync(){ /* junta los mensajes de todos los jugadores (están en su presencia) */
  if(!RM)return;
  try{
    const fresh=[];let mx=CH.seq;
    RM.all().forEach(p=>{
      const a=p.presence&&p.presence.ch;if(!a||typeof a!=="object")return;
      (Array.isArray(a)?a:Object.values(a)).slice(-8).forEach(m=>{
        if(!m||typeof m!=="object")return;const s=Math.floor(+m.s),x=typeof m.x==="string"?chText(m.x):"";if(!(s>0&&s<1e9)||!x)return;mx=Math.max(mx,s);
        const k=p.id+":"+s;if(CH.keys.has(k))return;CH.keys.add(k);
        fresh.push({k,s,pid:p.id,me:!!p.isMe,n:nmClean(p.presence.name)||"Amigo",x})})});
    CH.seq=mx;
    if(fresh.length){
      CH.log.push(...fresh);chSort();if(CH.log.length>200)CH.log.splice(0,CH.log.length-200);
      const others=fresh.filter(m=>!m.me).length;
      if(CH.init&&others){if(!CH.mounts.some(m=>m.el.isConnected))CH.unread+=others;Snd.play("click")}}
    CH.init=1;if(fresh.length)chPaint();chBadge();chNote()
  }catch(e){console.error(e)}}
function chSend(raw){
  if(!RM)return false;const x=chText(raw);if(!x)return false;
  const now=Date.now();if(now-CH.last<1200){toast("Un momento… escribe más despacio 🙂");return false}CH.last=now;
  const s=CH.seq+1;CH.seq=s;CH.my.push({s,x});if(CH.my.length>8)CH.my.shift();
  const k=RM.id+":"+s;CH.keys.add(k);CH.log.push({k,s,pid:RM.id,me:true,n:nmClean(D.name)||"Tú",x});chSort();
  RM.presence({ch:CH.my.slice()});chPaint();return true}
const chHTML=x=>`<div class="chm${x.me?" me":""}" style="--avc:${avc(x.n)}"><b>${esc(x.n)}</b><span>${esc(x.x)}</span></div>`;
function chPaint(){
  CH.mounts=CH.mounts.filter(m=>m.el.isConnected);
  CH.mounts.forEach(m=>{const l=$(".chlist",m.el);if(!l)return;
    const stick=!m.n||l.scrollTop+l.clientHeight>=l.scrollHeight-30,n=CH.log.length;
    if(m.n&&n>=m.n&&CH.log[m.n-1].k===m.k){if(n>m.n)l.insertAdjacentHTML("beforeend",CH.log.slice(m.n).map(chHTML).join(""))} /* solo se agregan los nuevos */
    else l.innerHTML=n?CH.log.map(chHTML).join(""):CHEMPTY;
    m.n=n;m.k=n?CH.log[n-1].k:"";if(stick)l.scrollTop=l.scrollHeight});
  if(CH.mounts.length&&CH.unread){CH.unread=0;chBadge()}}
function chBadge(){const n=CH.unread,t=n>9?"9+":String(n);$$(".chb .bdg").forEach(i=>{i.textContent=t;i.hidden=!n})}
function chNote(){ /* avisa si alguien tiene una versión sin chat */
  const old=RM?RM.all().filter(p=>!p.isMe&&!p.gone&&p.presence&&p.presence.name&&!p.presence.av).map(p=>nmClean(p.presence.name)||"Alguien"):[];
  $$(".chnote").forEach(e=>{if(old.length){e.hidden=false;e.textContent=old.join(", ")+(old.length>1?" tienen una versión anterior de la app y no ven el chat.":" tiene una versión anterior de la app y no ve el chat.")}else e.hidden=true})}
function chMount(el,inline){
  el.innerHTML=`<div class="chat">${inline?'<div class="chh"><b>💬 Chat de la sala</b></div>':""}<div class="chlist" role="log" aria-label="Mensajes de la sala" aria-relevant="additions"></div><p class="chnote" hidden></p>
  <div class="chq" role="group" aria-label="Mensajes rápidos">${CHQ.map(q=>`<button type="button" class="pill" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  <form class="chf" autocomplete="off"><input class="chi" maxlength="120" placeholder="Escribe un mensaje…" enterkeyhint="send" aria-label="Escribe un mensaje" autocomplete="off"><button class="chs" type="submit" aria-label="Enviar mensaje">➤</button></form></div>`;
  const inp=$(".chi",el);
  $(".chf",el).onsubmit=e=>{e.preventDefault();if(chSend(inp.value))inp.value="";inp.focus()};
  $$(".chq .pill",el).forEach(b=>b.onclick=()=>{if(chSend(b.dataset.q))Snd.play("click")});
  CH.mounts=CH.mounts.filter(m=>m.el.isConnected);CH.mounts.push({el,inline:!!inline,n:0,k:""});chPaint();chNote()}
function chOpen(){
  if(!RM||$("#chp"))return;
  const ov=document.createElement("div");ov.id="chov";ov.onclick=chClose;document.body.appendChild(ov);
  const p=document.createElement("div");p.id="chp";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true");p.setAttribute("aria-label","Chat de la sala");
  p.innerHTML=`<header><b>💬 Chat de la sala</b><button type="button" class="ibtn" id="chx" aria-label="Cerrar el chat">✕</button></header><div class="chbody"></div>`;
  document.body.appendChild(p);chMount($(".chbody",p),false);$("#chx").onclick=chClose;chFit();
  CH.unread=0;chBadge()}
function chClose(){["chp","chov"].forEach(i=>{const e=$("#"+i);if(e)e.remove()});CH.mounts=CH.mounts.filter(m=>m.el.isConnected);chBadge()}
function chFit(){ /* el panel queda siempre entero a la vista, también con el teclado abierto */
  const p=$("#chp");if(!p)return;const v=window.visualViewport,h=v?v.height:innerHeight,t=v?v.offsetTop:0;
  p.style.top=`calc(env(safe-area-inset-top,0px) + ${Math.round(t)+8}px)`;p.style.maxHeight=Math.max(240,Math.round(h*(h<540?.95:.64)))+"px";
  chShort();requestAnimationFrame(()=>requestAnimationFrame(chShort));setTimeout(chShort,250)}
/* si no entra todo (teclado abierto + letra grande) se esconden los mensajes rápidos para que el cuadro de escribir siempre se vea; se mide un par de cuadros después porque el teléfono tarda en acomodar la altura */
function chShort(){const p=$("#chp");if(!p)return;p.classList.remove("short");if(p.scrollHeight>p.clientHeight+1)p.classList.add("short")}
if(window.visualViewport){visualViewport.addEventListener("resize",chFit);visualViewport.addEventListener("scroll",chFit)}

function route(){

  else if(h==="ruleta")rSetup();
  else if(h==="amigos")lobby();
  return true}
