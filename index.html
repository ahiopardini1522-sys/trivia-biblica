*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain} /* evita que deslizar hacia abajo arriba de todo recargue la app en medio de una partida */
html.big{font-size:19px}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--f-ui);color:var(--ink);line-height:1.4;overflow-x:hidden;
  background:radial-gradient(900px 480px at 50% -140px,var(--glow),transparent 70%),radial-gradient(560px 460px at 110% 105%,rgba(67,136,255,.16),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg0)) fixed;
  background-color:var(--bg0)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--pat);z-index:0}
#app{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + .9rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1.6rem)}
#app:focus{outline:none}
body.hasnav #app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6.2rem)}
body.sheeted #app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14rem)}
h1,h2,h3{font-family:var(--f-disp);margin:0}
p{margin:0}
a{color:var(--goldtxt)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{animation:in .2s ease-out both}
.center{text-align:center}
.sub{color:var(--mut);text-align:center;margin:.35rem 0 1rem;font-size:.95rem}
.h1{font-size:1.7rem;text-align:center;margin:.2rem 0 .3rem;background:linear-gradient(90deg,var(--titleA),var(--titleB));-webkit-background-clip:text;background-clip:text;color:transparent}
.h2{font-size:1.15rem;margin:1.5rem 0 .65rem;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font:600 .8rem var(--f-ui);color:var(--mut)}

/* ---- botones ---- */
.btn{--c1:#2f6fe0;--c2:#2459c0;--d:#16408f;display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:3.4rem;padding:.8rem 1.1rem;border-radius:1.15rem;color:#fff;font-weight:800;font-size:1.06rem;letter-spacing:.2px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--d),0 12px 20px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 1px 0 rgba(0,0,0,.18);text-decoration:none}
.btn+.btn{margin-top:.85rem}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--d),0 4px 10px rgba(0,0,0,.25)}
.btn:disabled{filter:grayscale(.7) brightness(.85);opacity:.65}
.btn.gold{--c1:#ffd870;--c2:#f2a916;--d:#a86d07;color:var(--goldink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.green{--c1:#46dc9a;--c2:#22a869;--d:#13724a;color:#052e1b;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.red{--c1:#cf3d44;--c2:#b32b31;--d:#7d1b20}
.btn.purple{--c1:#b98af4;--c2:#8545d8;--d:#5a2ba0}
.btn.ghost{--c1:var(--panel2);--c2:var(--panel);--d:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line);text-shadow:none}
.btn.ghost:active:not(:disabled){transform:scale(.98);box-shadow:none}
.btn.sm{min-height:2.7rem;font-size:.95rem;padding:.55rem .9rem;border-radius:.95rem;box-shadow:0 4px 0 var(--d)}
.btn.sm.ghost{box-shadow:none}
.link{display:block;margin:1rem auto 0;color:var(--mut);text-decoration:underline;font-weight:600}
.ibtn{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:1.15rem;flex:none;transition:transform .1s}
.ibtn:active{transform:scale(.92)}

/* ---- cabecera / perfil ---- */
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.brand{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0}
.brand img{width:2.5rem;height:2.5rem;border-radius:.75rem;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.brand b{font-family:var(--f-disp);font-size:1.5rem;line-height:1;background:linear-gradient(90deg,var(--titleA),var(--titleB));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.25rem;padding:1rem;box-shadow:var(--sh)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center}
.av{--avc:var(--blue);width:3.5rem;height:3.5rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff;background:var(--avc);border:3px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.3);flex:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.prof .nm{display:block;max-width:100%;text-align:left;font-weight:800;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.5rem .6rem .5rem 0;margin:-.5rem 0}
.prof .nm::after{content:" ✏️";font-size:.72em;opacity:.7}
/* foto de perfil: llena el círculo; sin foto se ve la inicial */
.av.ph{padding:0;overflow:hidden;background:var(--panel2)}
.av img,.mav img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;pointer-events:none;-webkit-user-drag:none}
.avw{position:relative;flex:none;display:grid}
.cam{position:absolute;right:-.25rem;bottom:-.15rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font-size:.72rem;box-shadow:0 2px 6px rgba(0,0,0,.45);pointer-events:none}
.mav{display:inline-grid;place-items:center;vertical-align:middle;width:1.35rem;height:1.35rem;margin-right:.4rem;border-radius:50%;overflow:hidden;font-style:normal;font-size:.7rem;font-weight:800;color:#fff;background:var(--avc,var(--blue));text-shadow:0 1px 1px rgba(0,0,0,.3);flex:none;position:relative;top:-.06rem}
.srow .av{width:3rem;height:3rem;font-size:1.2rem}
.srow+.two{margin-bottom:.3rem}
.prof .rk{color:var(--goldtxt);font-size:.9rem;font-weight:700}
.xp{height:.6rem;border-radius:1rem;background:rgba(127,127,170,.28);overflow:hidden;margin-top:.45rem}
.xp i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:inherit;transition:width .9s ease}
.xpl{font-size:.76rem;color:var(--mut);margin-top:.25rem;display:flex;justify-content:space-between;gap:.5rem}
.xpl{flex-wrap:wrap;row-gap:.05rem}
.xpl span:first-child{white-space:nowrap;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}
.st3{background:var(--panel);border:1px solid var(--line);border-radius:.95rem;padding:.55rem .3rem;text-align:center}
.st3 b{display:block;font-size:1.2rem;font-family:var(--f-disp);color:var(--goldtxt);line-height:1.2}
.st3 span{font-size:.76rem;color:var(--mut)}

/* ---- versículo del día ---- */
.vod{margin-top:.9rem;padding:1rem 1.15rem;border-radius:1.25rem;background:linear-gradient(135deg,var(--paper),var(--paper2));color:var(--paperink);position:relative;overflow:hidden;box-shadow:var(--sh)}
.vod:before{content:"“";position:absolute;top:-.9rem;left:.5rem;font:900 6rem/1 var(--f-disp);color:#e0a21c;opacity:.28;pointer-events:none}
.vod small{font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:.74rem;color:#8a5a06;position:relative}
.vod p{margin:.3rem 0 .5rem;font-family:var(--f-disp);font-size:1.1rem;line-height:1.38;position:relative}
.vod .vr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.1rem .6rem;font-size:.85rem;color:var(--papermut);font-weight:700;position:relative}
/* v4.6: la referencia y los tres botones ya no se pisan en celulares angostos: si no entran, los botones bajan a su propia fila */
.vod .vact{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:.3rem .4rem;margin-left:auto;max-width:100%}
.vod .vref{min-width:0;overflow-wrap:anywhere}
.vod .vr a,.vod .vr button{display:inline-flex;align-items:center;justify-content:center;min-height:2.4rem;min-width:2.4rem;padding:0 .8rem;border-radius:1.2rem;background:rgba(122,79,5,.12);color:#7a4f05;font-weight:800;text-decoration:none;white-space:nowrap}

/* ---- CTA y fichas ---- */
.cta{display:flex;align-items:center;gap:1rem;width:100%;margin-top:1rem;padding:1rem 1.1rem;border-radius:1.5rem;text-align:left;color:var(--goldink);background:linear-gradient(135deg,#ffd870,#f2a916);box-shadow:0 6px 0 #a86d07,0 16px 26px rgba(0,0,0,.35);position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #a86d07,0 4px 10px rgba(0,0,0,.3)}
.cta:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(0) skewX(-18deg);will-change:transform;animation:shine 4.5s ease-in-out infinite}
.cta svg{width:4.6rem;height:4.6rem;flex:none;animation:spin 16s linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.cta b{display:block;font-family:var(--f-disp);font-size:1.5rem;line-height:1.1}
.cta span{font-size:.92rem;font-weight:600;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.9rem}
.tile{--tc:var(--blue);display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;padding:.9rem;border-radius:1.2rem;background:var(--panel);border:1px solid var(--line);text-align:left;position:relative;min-height:6.4rem;transition:transform .1s,background .2s}
.tile:active:not(:disabled){transform:scale(.97)}
.tile .ic{font-size:1.5rem;width:2.7rem;height:2.7rem;border-radius:.9rem;display:grid;place-items:center;background:var(--tc);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tile b{font-weight:800;margin-top:.4rem;line-height:1.15}
.tile small{display:block;color:var(--mut);font-size:.78rem;line-height:1.25}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:.9rem;min-height:0}
.tile.wide b{margin-top:0;display:block}
.tile:disabled{opacity:.7}
.tile .tag{position:absolute;top:.7rem;right:.7rem;font-size:.74rem;font-weight:800;padding:.15rem .5rem;border-radius:1rem;background:var(--gold);color:var(--goldink)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.lv{--lc:var(--blue);padding:.85rem .3rem .7rem;text-align:center;border-radius:1.15rem;background:var(--panel);border:1px solid var(--line);border-bottom:4px solid var(--lc);position:relative;transition:transform .1s}
.lv i{font-style:normal;font-size:1.8rem;display:block;line-height:1.2}
.lv b{display:block;font-size:.92rem;margin-top:.1rem}
.lv small{display:block;font-size:.76rem;color:var(--mut);line-height:1.25;margin-top:.1rem}
.lv:not(:disabled):active{transform:scale(.96)}
.lv:disabled{opacity:.55;border-bottom-color:var(--line)}
.pills{display:flex;gap:.45rem;overflow-x:auto;margin:0 -1rem;padding:.15rem 1rem .6rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:.45rem .8rem;border-radius:2rem;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.on{background:var(--gold);color:var(--goldink);border-color:transparent}
.pill.gold{background:linear-gradient(180deg,#ffd870,#f2a916);color:var(--goldink);border:0;font-weight:800;padding:.4rem .8rem}

/* ---- navegación inferior ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:.4rem .8rem calc(.45rem + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav[hidden]{display:none}
.nav>div{pointer-events:auto;display:flex;gap:.25rem;width:100%;max-width:28.5rem;background:var(--navbg);border:1px solid var(--line);border-radius:1.5rem;padding:.35rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.05rem;padding:.4rem 0;border-radius:1.15rem;font-size:.76rem;font-weight:700;color:var(--mut);transition:background .2s,transform .1s}
.nav button:active{transform:scale(.92)}
.nav button span{font-size:1.3rem;line-height:1.2}
.nav button.on{background:var(--gold);color:var(--goldink)}

/* ---- partida ---- */
.gtop{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem}
.gtop .ttl{flex:1;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:1.1rem}
.dots{flex:1;display:flex;gap:.28rem;justify-content:center}
.dots i{flex:1;max-width:1.25rem;height:.5rem;border-radius:1rem;background:rgba(127,127,170,.32);transition:background .3s}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}
.dots i.cur{background:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.qcard{--cc:var(--gold);--on:#fff;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paperink);border-radius:1.4rem;padding:0 0 1.2rem;box-shadow:var(--sh);overflow:hidden;animation:pop .35s both}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem .8rem .5rem 1.05rem;min-height:3.4rem;background:linear-gradient(180deg,var(--cc),var(--ccd,var(--cc)));color:var(--on);font-weight:800;font-size:.95rem}
.qhead .qn{opacity:.85;font-weight:700;font-size:.78rem;display:block}
.q{font-family:var(--f-disp);font-size:1.38rem;line-height:1.3;margin:1rem 1.1rem 0;font-weight:700}
.q.cz{font-family:var(--f-ui);font-size:1.04rem;line-height:1.55;font-weight:600;text-align:left}
.q.cz .czr{display:block;font-size:.74rem;font-weight:800;letter-spacing:.02em;opacity:.72;margin-bottom:.45rem}
.blank{display:inline-block;min-width:3.4em;padding:0 .3em;border-bottom:3px solid var(--cc);color:var(--cc);font-weight:800;text-align:center;border-radius:.2em .2em 0 0;background:rgba(120,120,120,.14);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.blank.ok{color:#0f8a56;border-color:#0f8a56;background:rgba(15,138,86,.13)}.blank.bad{color:#c8323a;border-color:#c8323a;background:rgba(200,50,58,.12)}
.ring{position:relative;width:2.8rem;height:2.8rem;flex:none}
.ring:before{content:"";position:absolute;inset:-1px;border-radius:50%;background:rgba(0,0,0,.28)}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .tr{stroke:rgba(255,255,255,.3)}
.ring .pg{stroke:#fff;stroke-linecap:round;stroke-dasharray:100.53;stroke-dashoffset:0;transition:stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem;font-weight:900;color:#fff}
.ring.warn{animation:pulse .6s infinite}
.ring.warn .pg{stroke:#ffd23f}.ring.warn b{color:#ffd23f}
.combo{display:flex;justify-content:center;min-height:1.9rem;margin-top:.3rem}
.combo span{padding:.25rem .8rem;border-radius:2rem;background:linear-gradient(180deg,#d4531a,#bf410d);color:#fff;font-weight:900;font-size:.85rem;animation:pop .4s both;box-shadow:0 3px 0 #9b3208}
.opts{display:grid;gap:.65rem;margin-top:.4rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.8rem .9rem;min-height:3.6rem;border-radius:1.1rem;background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:1.05rem;font-weight:650;transition:transform .08s,background .2s,border-color .2s,opacity .25s;line-height:1.25;animation:in .22s ease-out both}
.opt:nth-child(2){animation-delay:.03s}.opt:nth-child(3){animation-delay:.06s}.opt:nth-child(4){animation-delay:.09s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.opt .ltr{flex:none;width:2.1rem;height:2.1rem;border-radius:.7rem;display:grid;place-items:center;font-weight:900;background:var(--gold);color:var(--goldink)}
.opt.ok{background:linear-gradient(180deg,#46dc9a,#22a869);border-color:#178a58;color:#052e1b;animation:bounce .5s}
.opt.ok .ltr{background:#0b5a37;color:#fff}
.opt.bad{background:linear-gradient(180deg,#d23f45,#b92b32);border-color:#8f1f25;color:#fff;animation:shake .45s}
.opt.bad .ltr{background:#fff;color:#a02027}
.opt.dim{opacity:.42}
.opt.gone{opacity:.12;pointer-events:none;transform:scale(.96)}
.life{display:flex;justify-content:center;gap:.7rem;margin-top:1.1rem}
.lf{position:relative;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-width:4.8rem;padding:.5rem .6rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);font-size:.7rem;font-weight:700;color:var(--mut);transition:transform .1s}
.lf:active:not(:disabled){transform:scale(.94)}
.lf span{font-size:1.35rem;line-height:1.1}
.lf em{position:absolute;top:-.4rem;right:-.2rem;font-style:normal;min-width:1.25rem;height:1.25rem;border-radius:1rem;background:var(--gold);color:var(--goldink);font-size:.72rem;font-weight:900;display:grid;place-items:center}
.lf:disabled{opacity:.35}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;margin-bottom:.8rem}
.vs .p{display:flex;align-items:center;gap:.5rem;padding:.4rem .55rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);min-width:0;transition:background .3s}
.vs .p .av{width:2rem;height:2rem;font-size:.85rem;border-width:2px}
.vs .p b{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .p .sc{margin-left:auto;font-weight:900;color:var(--goldtxt)}
.vs .p.hit{background:var(--panel2);animation:pulse .5s}
.vs .x{font-family:var(--f-disp);font-weight:900;color:var(--goldtxt)}
.live{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.8rem;scrollbar-width:none}
.live::-webkit-scrollbar{display:none}
.live span{flex:none;padding:.3rem .65rem;border-radius:2rem;background:var(--panel);border:1px solid var(--line);font-size:.78rem;font-weight:700}
.live span.me{background:var(--gold);color:var(--goldink);border-color:transparent}

/* ---- contrarreloj, libros, imagen de versículo ---- */
.rbar{flex:1;position:relative;height:2.2rem;border-radius:1.1rem;background:rgba(127,127,170,.28);overflow:hidden;border:1px solid var(--line)}
.rbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .12s linear}
.rbar b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--goldink)}
.rbar.warn i{background:linear-gradient(90deg,#b32b31,#d2481f)}
.rbar.warn b{color:#fff}
.bkl{display:flex;flex-wrap:wrap;gap:.5rem}
.bkc{--cc:var(--blue);display:flex;align-items:center;gap:.45rem;padding:.55rem .8rem;border-radius:2rem;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--cc);font-weight:700;font-size:.88rem;transition:transform .1s}
.bkc:active{transform:scale(.95)}
.bkc small{min-width:1.35rem;height:1.35rem;padding:0 .3rem;border-radius:1rem;background:var(--cc);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.vimg{width:100%;display:block;border-radius:1rem;margin:.6rem 0;box-shadow:var(--sh)}
.verse .vsh{display:block;margin-top:.45rem;color:var(--goldtxt);font-weight:800}

/* ---- hoja de respuesta ---- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;--sc:var(--ok)}
.sheet.bad{--sc:var(--bad)}
.sheet>div{pointer-events:auto;width:100%;max-width:30rem;max-height:64vh;overflow:auto;padding:1rem 1.1rem calc(1rem + env(safe-area-inset-bottom,0px));background:var(--sheetbg);color:var(--ink);border-top:4px solid var(--sc);border-radius:1.6rem 1.6rem 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.45);animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet h3{font-size:1.35rem;display:flex;align-items:center;gap:.5rem;color:var(--sc);margin-bottom:.25rem}
.sheet h3 b{background:var(--sc);color:var(--onok,#042515);border-radius:2rem;padding:.05rem .6rem;font:800 .95rem var(--f-ui)}
.sheet .ans{margin:.1rem 0 .2rem}
.verse{margin:.5rem 0 .8rem;padding:.65rem .85rem;border-left:4px solid var(--gold);background:var(--panel);border-radius:.7rem;font-size:.9rem}
.verse i{font-family:var(--f-disp);font-size:1rem;display:block;margin:.2rem 0;font-style:italic;line-height:1.35}
.verse small{font:600 .76rem var(--f-ui);color:var(--mut);font-style:normal}
.verse a,.verse .vrv{display:block;margin-top:.3rem;color:var(--goldtxt);font-weight:800;text-decoration:none;text-align:left}
/* lector de la Reina-Valera 1960 */
.rv{max-height:46vh;overflow:auto;margin:.3rem 0 .2rem;padding:.1rem .1rem .1rem 0}
.rvt{white-space:pre-line;font-family:var(--f-disp);font-size:1.08rem;line-height:1.5;text-align:left;color:var(--ink)}
.rvt.err{font-family:var(--f-ui);font-size:.95rem;color:var(--bad);font-weight:700}
.rvc{font-size:.76rem;color:var(--mut);text-align:left;margin:.5rem 0 0!important}
.rvd{font-size:.7rem;color:var(--mut);text-align:left;margin:.45rem 0 0!important;word-break:break-all;opacity:.85}.rvd:empty{display:none}
.rvl{display:block;margin-top:.5rem;color:var(--goldtxt);font-weight:800;text-decoration:none;text-align:left}
.adv{margin-top:1rem}.adv summary{cursor:pointer;font-weight:800;padding:.1rem 0}
#yvR{white-space:pre-line;text-align:left}#yvR:empty{display:none}#yvR[data-s=ok]{border-color:var(--ok);color:var(--ink)}#yvR[data-s=bad]{border-color:var(--bad);color:var(--ink)}

/* ---- resultado ---- */
.res{text-align:center;padding:.6rem 0 0}
.trophy{font-size:4.6rem;line-height:1.1;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.stars{display:flex;justify-content:center;gap:.4rem;font-size:2.5rem;margin:.2rem 0}
.stars span{filter:grayscale(1) opacity(.3)}
.stars span.on{filter:none;animation:pop .55s both}
.score{font-family:var(--f-disp);font-size:4.4rem;font-weight:900;color:var(--goldtxt);line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.22)}
.res .msg{font-family:var(--f-disp);font-size:1.25rem;margin:.3rem 0 .2rem}
.chips{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.8rem 0 1.1rem}
.chip{padding:.4rem .8rem;border-radius:2rem;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:700}
.chip.new{background:var(--gold);color:var(--goldink);border-color:transparent;animation:pop .5s both}
.rank{margin:.6rem 0;padding:.8rem 1rem;text-align:left}
.rank div{display:flex;justify-content:space-between;gap:.5rem;padding:.3rem 0;font-weight:700}
.rank div+div{border-top:1px solid var(--line)}
.rank .me{color:var(--goldtxt)}

/* ---- ruleta ---- */
.board{display:flex;gap:.5rem;margin-bottom:.4rem}
.pl{--pc:var(--blue);flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem .3rem;border-radius:1.05rem;background:var(--panel);border:2px solid var(--line);transition:all .25s;position:relative}
.pl .av{width:2.4rem;height:2.4rem;font-size:1rem;border-width:2px;background:var(--pc)}
.pl b{font-size:.8rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cr{font-size:.95rem;letter-spacing:.04rem;line-height:1.2}
.pl .cr .off{opacity:.22;filter:grayscale(1)}
.pl.on{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 3px var(--glow),0 6px 18px rgba(0,0,0,.3);transform:translateY(-2px)}
.turn{text-align:center;color:var(--mut);margin:.5rem 0 .2rem;font-size:.95rem}
.turn b{color:var(--ink);font-size:1.05rem}
.pips{display:flex;gap:.45rem;justify-content:center;align-items:center;margin:.35rem 0;color:var(--mut);font-size:.8rem;font-weight:700}
.pips i{width:.95rem;height:.95rem;border-radius:50%;background:rgba(127,127,170,.3);border:2px solid var(--line);transition:all .3s}
.pips i.on{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 10px var(--glow)}
.wheelbox{position:relative;width:min(100%,19.5rem);margin:.5rem auto .8rem}
.wheel{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.bulb{animation:blink 1s steps(1) infinite}
.bulb.b2{animation-delay:.5s}
.spinning .bulb{animation-duration:.25s}
.catpill{--cc:var(--gold);--on:#fff;display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;border-radius:1.15rem;background:var(--cc);color:var(--on);font-weight:900;font-size:1.15rem;animation:pop .4s both;box-shadow:0 5px 0 var(--ccd,rgba(0,0,0,.3))}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:1rem}
.legend span{display:flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:700;color:var(--mut);padding:.3rem .45rem;border-radius:.7rem;background:var(--panel)}
.legend i{width:.7rem;height:.7rem;border-radius:50%;background:var(--cc);flex:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.9rem}
.cat{--cc:var(--blue);--on:#fff;padding:1rem .5rem;border-radius:1.2rem;text-align:center;font-weight:800;color:var(--on);background:linear-gradient(180deg,var(--ccl,var(--cc)),var(--cc));box-shadow:0 5px 0 var(--ccd,rgba(0,0,0,.3)),0 12px 18px rgba(0,0,0,.25);transition:transform .08s;line-height:1.2}
.cat i{display:block;font-style:normal;font-size:2rem;margin-bottom:.15rem}
.cat:active:not(:disabled){transform:translateY(4px)}
.cat:disabled{filter:grayscale(.6);opacity:.6}

/* ---- sala en línea ---- */
.room{text-align:center}
.room .code{font-family:var(--f-disp);font-size:1.7rem;font-weight:900;letter-spacing:.04em;color:var(--goldtxt)}
.plist{margin-top:.9rem}
.prow{display:flex;align-items:center;gap:.7rem;padding:.55rem 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow .av{width:2.4rem;height:2.4rem;font-size:1rem;border-width:2px}
.prow b{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{color:var(--mut);font-weight:700}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--ok);margin-right:.3rem;box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.warn{padding:.7rem .9rem;border-radius:1rem;background:rgba(239,90,90,.16);border:1px solid rgba(239,90,90,.5);font-size:.88rem;margin-top:.8rem}
.note{padding:.7rem .9rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);font-size:.86rem;color:var(--mut);margin-top:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.two .btn+.btn{margin-top:0}

/* ---- formularios ---- */
label.lbl{display:block;font-size:.8rem;font-weight:800;color:var(--mut);margin:1rem 0 0;letter-spacing:.03em;text-transform:uppercase}
input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.8rem 1rem;margin-top:.45rem;outline:0;transition:border-color .2s}
input:focus{border-color:var(--gold)}
input::placeholder{color:var(--soft)}
textarea.bkt{width:100%;font:inherit;font-size:.82rem;line-height:1.35;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.7rem .8rem;margin:.2rem 0 .4rem;outline:0;resize:none;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}textarea.bkt:focus{border-color:var(--gold)}
.note.bad{border-color:var(--bad);color:var(--ink)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.2rem;gap:.2rem;margin-top:.5rem}
.seg button{flex:1;padding:.55rem .4rem;border-radius:.8rem;font-size:.82rem;font-weight:800;color:var(--mut);transition:background .2s}
.seg button.on{background:var(--gold);color:var(--goldink)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow b{display:block}
.srow small{color:var(--mut);font-size:.8rem}
.switch{width:3.2rem;height:1.85rem;border-radius:1rem;background:rgba(127,127,170,.45);position:relative;transition:background .2s;flex:none}
.switch:before{content:"";position:absolute;inset:-.6rem -.45rem}
.switch:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.45rem;height:1.45rem;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]:after{transform:translateX(1.35rem)}

/* ---- logros ---- */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
.sbox{padding:.8rem;border-radius:1.1rem;background:var(--panel);border:1px solid var(--line);text-align:center}
.sbox b{display:block;font-family:var(--f-disp);font-size:1.6rem;color:var(--goldtxt);line-height:1.2}
.sbox span{font-size:.78rem;color:var(--mut)}
.bk{display:grid;grid-template-columns:2rem 1fr 3rem;align-items:center;gap:.6rem;padding:.4rem 0;font-size:.85rem;font-weight:700}
.bk .bar{height:.7rem;border-radius:1rem;background:rgba(127,127,170,.28);overflow:hidden}
.bk .bar i{display:block;height:100%;width:var(--w,0%);background:var(--cc);border-radius:inherit;transition:width .9s ease}
.bk em{font-style:normal;text-align:right;color:var(--mut)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.md{padding:.75rem .3rem;border-radius:1.05rem;background:var(--panel);border:1px solid var(--line);text-align:center}
.md i{font-style:normal;font-size:2.1rem;display:block;line-height:1.2}
.md b{font-size:.78rem;display:block;line-height:1.2;margin-top:.1rem}
.md small{font-size:.76rem;color:var(--mut);display:block;line-height:1.25;margin-top:.15rem}
.md.off{opacity:.5}
.md.off i{filter:grayscale(1)}
.md.on{border-color:var(--gold);background:var(--panel2)}

/* ---- ayuda ---- */
.help h3{font-size:1.05rem;margin:1.1rem 0 .25rem;color:var(--goldtxt)}
.help p,.help li{color:var(--ink);font-size:.93rem}
.help ul{margin:.2rem 0;padding-left:1.1rem}

/* ---- modal / aviso / confeti ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,8,25,.68);display:grid;place-items:center;padding:1.2rem;animation:fade .2s both}
.md2{width:100%;max-width:23.5rem;background:var(--sheetbg);color:var(--ink);border:1px solid var(--line);border-radius:1.5rem;padding:1.3rem;box-shadow:var(--sh);animation:pop .28s both;max-height:88vh;overflow:auto}
.md2 h3{font-size:1.3rem;margin-bottom:.4rem}
.md2 p{color:var(--mut);margin-bottom:.6rem}
.mbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr));gap:.6rem;margin-top:1rem} /* dos botones lado a lado si entran; si no (celular chico con letra grande), uno debajo del otro */
.mbtns .btn{margin:0!important}
.mbtns.col{grid-template-columns:minmax(0,1fr)}
.toast{position:fixed;left:50%;bottom:calc(6.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;max-width:92vw;padding:.7rem 1rem;border-radius:1rem;background:#0b1536;color:#fff;border:1px solid rgba(255,255,255,.22);font-weight:700;font-size:.92rem;box-shadow:var(--sh);transition:opacity .25s,transform .25s;display:flex;gap:.8rem;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#ffd470;font-weight:900;white-space:nowrap}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ---- animaciones ---- */
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,60%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(475%) skewX(-18deg)}}

@media (min-width:640px){
  #app{padding-top:2rem}
  .nav>div{max-width:28.5rem}
}
@media (max-width:350px){
  html{font-size:15px}
  .tiles{gap:.5rem}
  .lvls{gap:.4rem}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
noscript{display:block;padding:2rem;text-align:center;color:var(--ink)}

/* ruleta por equipos y salas por equipos */
.board.teams{gap:.6rem}
.tmb{--pc:var(--blue);flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.55rem .4rem .6rem;border-radius:1.05rem;background:var(--panel);border:2px solid var(--line);transition:all .25s}
.tmb b{font-size:.82rem;color:var(--pc);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmb .cr{font-size:.95rem;letter-spacing:.04rem;line-height:1.2}.tmb .cr .off{opacity:.22;filter:grayscale(1)}
.tmb .mems{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:center}
.tmb .mems .av{width:1.9rem;height:1.9rem;font-size:.8rem;border-width:2px;opacity:.55}
.tmb .mems .av.cur{opacity:1;box-shadow:0 0 0 2px var(--gold)}
.tmb.on{border-color:var(--pc);background:var(--panel2);box-shadow:0 0 0 3px var(--glow),0 6px 18px rgba(0,0,0,.3);transform:translateY(-2px)}
.teamsel{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
.tcol{--pc:var(--blue);border:2px solid var(--pc);border-radius:1rem;padding:.5rem .55rem;background:var(--panel);text-align:left}
.tcol>b{display:block;font-size:.85rem;color:var(--pc);margin-bottom:.2rem}
.tcol .prow{padding:.35rem 0;gap:.5rem}.tcol .prow .av{width:1.9rem;height:1.9rem;font-size:.8rem}.tcol .prow b{font-size:.85rem}.tcol .prow small{display:none}
.tcol .mut{color:var(--mut)}
/* reacciones con emojis */
.rxpos{position:absolute;top:.5rem;right:.5rem}
#rxr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 3.9rem);right:.6rem;z-index:70;display:flex;gap:.15rem;padding:.3rem .45rem;border-radius:2rem;background:var(--sheetbg,var(--panel2));border:1px solid var(--line);box-shadow:var(--sh);animation:pop .2s both}
#rxr button{font-size:1.55rem;line-height:1;padding:.3rem .35rem;background:none;border:0;border-radius:.8rem;cursor:pointer}
#rxr button:active{background:var(--panel)}
#rxl{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:65;pointer-events:none;overflow:hidden}
.rxf{position:absolute;left:var(--x,50%);bottom:.5rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;animation:rxup 2.6s ease-out forwards}
.rxf i{font-style:normal;font-size:2.4rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.rxf small{font-size:.7rem;font-weight:800;padding:.05rem .45rem;border-radius:1rem;background:var(--sheetbg,var(--panel2));color:var(--ink);border:1px solid var(--line)}
@keyframes rxup{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:1;transform:translateY(-4vh) scale(1.15)}100%{transform:translateY(-38vh) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.rxf{animation:rxfade 1.8s linear forwards;bottom:30%}@keyframes rxfade{0%,70%{opacity:1}100%{opacity:0}}}

/* arma el versículo */
.arn{flex:none;font-weight:900;font-size:.85rem;padding:.2rem .65rem;border-radius:2rem;background:rgba(0,0,0,.22);color:var(--on)}
.arref{margin:.9rem 1.1rem 0;font-weight:800;font-size:.9rem;color:var(--paperink);opacity:.85}
.arref small{font-weight:700;opacity:.7;font-size:.76rem}
.arv{margin:.45rem 1.1rem .1rem;font-family:var(--f-disp);font-size:1.22rem;line-height:1.95;font-weight:600;text-align:left;color:var(--paperink)}
.aw{display:inline-block;vertical-align:baseline}
.aw.e{height:1.15em;vertical-align:-.28em;margin:0 .05em;border-bottom:3px solid var(--cc);border-radius:.25em .25em 0 0;background:rgba(120,120,120,.14);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.aw.e.c{animation:blink 1.1s ease-in-out infinite;background:rgba(120,120,120,.3);background:color-mix(in srgb,var(--cc) 34%,transparent)}
.aw.f{color:#0f8a56;font-weight:800}
.aw.f.h{color:#9a6407}
.aw.f.j{animation:pop .35s both}
.arbar{height:.4rem;margin:.8rem 1.1rem 0;border-radius:1rem;background:rgba(0,0,0,.1);overflow:hidden}
.arbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cc),var(--ccl,var(--cc)));border-radius:1rem;transition:width .25s}
.arch{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-top:1.1rem}
.arw{padding:.6rem .95rem;min-height:2.9rem;border-radius:1rem;background:var(--panel2);border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.22);font-family:var(--f-disp);font-size:1.12rem;font-weight:700;transition:transform .08s,background .2s}
.arw:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.arw.used{visibility:hidden}
.arch.done{display:none}
.arw.wrong{animation:shake .4s;background:linear-gradient(180deg,#d23f45,#b92b32);border-color:#8f1f25;color:#fff}
.arbt{display:flex;justify-content:center;margin-top:1.1rem}
.arbt .btn{width:auto;min-width:11rem}
.arbt .btn small{opacity:.7;font-weight:700;font-size:.75rem}
.arlvs{display:grid;gap:.55rem;margin:.7rem 0 .2rem}
.arlv{display:block;width:100%;text-align:left;padding:.7rem .85rem;border-radius:1rem;background:var(--panel);border:2px solid var(--line);transition:transform .1s}
.arlv b{display:block;font-size:1.02rem}
.arlv small{display:block;color:var(--mut);font-size:.8rem;margin-top:.1rem}
.arlv.on{border-color:var(--gold);background:var(--panel2)}
.arlv:active{transform:scale(.98)}

/* mapa de la biblia */
.mapsum{margin:.2rem 0 .3rem;text-align:center}
.mapsum .mst{display:flex;justify-content:center;align-items:baseline;gap:.4rem;margin-bottom:.4rem}
.mapsum .mst b{font-family:var(--f-disp);font-size:1.9rem;color:var(--goldtxt);line-height:1.1}
.mapsum .mst span{color:var(--mut);font-weight:700}
.mapsum small{display:block;margin-top:.45rem;color:var(--mut);font-size:.82rem}
.bkm{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.bkb{--cc:var(--blue);display:flex;flex-direction:column;gap:.2rem;align-items:flex-start;padding:.55rem .7rem .5rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--cc);text-align:left;min-width:0;transition:transform .1s,background .2s}
.bkb:active{transform:scale(.96)}
.bkb b{font-size:.9rem;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkb .bkr{display:flex;align-items:center;justify-content:space-between;gap:.4rem;width:100%}
.bkb em{font-style:normal;font-size:.74rem;font-weight:700;color:var(--mut)}
.sr{display:inline-flex;gap:.05rem;font-size:1.02rem;line-height:1}
.sr i{font-style:normal;color:rgba(160,160,190,.45)}
.sr i.on{color:#f6b92a;text-shadow:0 1px 0 rgba(120,70,0,.35)}
.bkb.s3{background:var(--panel2);border-color:var(--gold);border-left-color:var(--cc);box-shadow:0 0 0 1px var(--gold) inset}
.bkb.s1{background:var(--panel)}

/* leer en voz alta */
.qrt{display:flex;align-items:center;gap:.5rem;flex:none}
.spk{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.35);font-size:1.1rem;line-height:1;transition:transform .1s,background .2s}
.spk:active{transform:scale(.92)}
.spk.on{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.verse .vsp{display:block;margin-top:.4rem;color:var(--goldtxt);font-weight:800;text-align:left}
.verse .vsp.on{text-decoration:underline}
.vod .vr #vsp.on{background:rgba(122,79,5,.32)}

/* ---- tamaño del texto: Normal 16 px · Grande 19 px · Muy grande 22 px (Ajustes o el botón Aa) ---- */
html.xbig{font-size:22px}
/* la cabecera NO crece con el texto (mide casi lo mismo en px en los 3 tamaños): así los 3 botones entran en celulares chicos */
.top,.brand{gap:.5rem}
.brand img{width:2.25rem;height:2.25rem}
.brand b{font-size:1.25rem}
.top .ibtn{width:2.5rem;height:2.5rem;font-size:1.1rem}
.top .ibtn.fz{font:800 1rem var(--f-disp);letter-spacing:-.04em}
.top .ibtn.fz.on{background:var(--gold);color:var(--goldink);border-color:transparent}
html.big .top,html.big .brand{gap:.42rem}
html.big .brand img{width:1.9rem;height:1.9rem}
html.big .brand b{font-size:1.05rem}
html.big .top .ibtn{width:2.1rem;height:2.1rem;font-size:.93rem}
html.big .top .ibtn.fz{font-size:.85rem}
html.xbig .top,html.xbig .brand{gap:.36rem}
html.xbig .brand img{width:1.64rem;height:1.64rem}
html.xbig .brand b{font-size:.91rem}
html.xbig .top .ibtn{width:1.82rem;height:1.82rem;font-size:.8rem}
html.xbig .top .ibtn.fz{font-size:.73rem}
@media (max-width:350px){html.big .brand img,html.xbig .brand img{display:none}}
/* rejillas que no se ensanchan por una palabra larga (si no, se salen del ancho de la pantalla) */
.tiles,.two,.bkm{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats3,.lvls,.medals{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile b,.tile small,.md b,.md small,.lv b,.lv small,.st3 span{overflow-wrap:anywhere}
.h2{flex-wrap:wrap;gap:.1rem .6rem}
html.big .tile{padding:.8rem .7rem}
html.big .tile b{font-size:.94rem}
html.big .seg button,html.xbig .seg button{padding:.55rem .25rem;min-width:0}
html.big .life,html.xbig .life{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
html.big .lf,html.xbig .lf{min-width:0;padding:.45rem .2rem}
html.big .lf em,html.xbig .lf em{right:.1rem;top:-.35rem}
/* texto muy grande: todo en una columna, y los botones en fila vuelven a apilarse */
html.xbig .tiles,html.xbig .lvls,html.xbig .two,html.xbig .bkm{grid-template-columns:minmax(0,1fr)}
html.xbig .medals{grid-template-columns:repeat(2,minmax(0,1fr))}
html.xbig .seg{flex-wrap:wrap}
html.xbig .seg button{flex:1 1 40%}
html.xbig .tile.wide .tag{position:static;margin-left:auto;flex:none}
html.xbig .prof .nm{white-space:normal;overflow-wrap:anywhere}
@media (max-width:340px){html.big .tiles,html.big .two{grid-template-columns:minmax(0,1fr)}}
.opts{grid-template-columns:minmax(0,1fr)}
.opt{overflow-wrap:anywhere}

/* ---- Modo niños (v4.0): botones y letras grandes, colores alegres, figuritas ---- */
.tile.kidt{background:linear-gradient(135deg,rgba(255,196,64,.24),var(--panel));border-color:rgba(232,168,23,.6)}
.kbig{min-height:4.6rem;font-size:1.6rem;border-radius:1.5rem;margin:.3rem 0 1rem}
.kalb .khd{display:flex;justify-content:space-between;align-items:baseline;gap:.2rem .6rem;flex-wrap:wrap}
.kalb .khd span{font:800 1.2rem var(--f-disp);color:var(--goldtxt)}
.kalb .ksub{margin:.55rem 0 .7rem;color:var(--mut);font-size:.9rem}
.kids .qcard{border-radius:1.6rem}
.kids .q{font-size:1.65rem;line-height:1.32;text-align:center;margin:1.15rem 1.1rem 0;overflow-wrap:anywhere}
.kids .opts{gap:.8rem}
.kids .opt{min-height:4.4rem;font-size:1.2rem;font-weight:750;border-width:3px;border-radius:1.4rem;padding:.8rem 1rem}
.kids .opt .ltr{width:2.7rem;height:2.7rem;border-radius:50%;font-size:1.25rem;color:#fff;background:#e5484d}
.kids .opt:nth-child(2) .ltr{background:#2f6fe0}
.kids .opt:nth-child(3) .ltr{background:#178a55}
.kids .opt:nth-child(4) .ltr{background:#ffd24a;color:#3a2500}
.kids .opt.ok .ltr{background:#0b5a37;color:#fff}
.kids .opt.bad .ltr{background:#fff;color:#a02027}
.kids .spk{width:3.1rem;height:3.1rem;font-size:1.4rem}
.kids .dots i{height:.7rem}
.kids .life{margin-top:1.2rem}
.kids .lf{min-width:5.8rem;padding:.6rem .8rem;font-size:.85rem}
.kids .lf span{font-size:1.6rem}
.sheet.kid h3{font-size:1.75rem}
.sheet.kid h3 b{font-size:1.1rem}
.sheet.kid .ans{font-size:1.2rem}
.sheet.kid .btn{min-height:4.2rem;font-size:1.3rem}
.newst{display:flex;align-items:center;gap:1rem;margin:1rem auto 0;max-width:21rem;padding:.8rem 1.1rem;border-radius:1.4rem;background:linear-gradient(180deg,#ffe49a,#f6b72d);color:#3a2500;box-shadow:0 5px 0 #a86d07;text-align:left;animation:pop .6s .5s both}
.newst i{font-style:normal;font-size:3.4rem;line-height:1;flex:none}
.newst span{display:block;font-size:.88rem;font-weight:800;min-width:0}
.newst b{display:block;font:800 1.25rem/1.15 var(--f-disp);overflow-wrap:anywhere}
.kst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.ks{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.7rem .3rem;min-height:6.8rem;border-radius:1.15rem;background:var(--panel);border:2px solid var(--line);text-align:center}
.ks i{font-style:normal;font-size:2.5rem;line-height:1.1}
.ks b{font-size:.76rem;line-height:1.2;overflow-wrap:anywhere}
.ks.on{border-color:var(--kc);box-shadow:0 4px 0 var(--kc);background:linear-gradient(180deg,var(--panel),var(--panel2))}
.ks.on:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kc)}
.ks.off{opacity:.5}
.ks.off i{filter:grayscale(1)}
.kmd{text-align:center}
.kmd i{display:block;font-style:normal;font-size:5.2rem;line-height:1.15;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.kmd h3{color:var(--kc);margin-bottom:.3rem}
.kmd .btn{margin-top:.2rem}
html.big .kids .q{font-size:1.5rem}
html.big .kids .opt{font-size:1.1rem}
html.xbig .kids .q{font-size:1.35rem}
html.xbig .kids .opt{font-size:1rem;min-height:4rem}
html.xbig .kids .opt .ltr{width:2.4rem;height:2.4rem}
html.big .kbig,html.xbig .kbig{font-size:1.3rem}
html.xbig .kst{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:340px){html.big .kst{grid-template-columns:repeat(2,minmax(0,1fr))}.kids .lf{min-width:0}}
/* los dibujitos (emoji) de los títulos: el degradado del título los pintaba como una mancha lisa; así conservan sus colores */
.h1 .em{-webkit-text-fill-color:#fff;color:#fff}
/* si la hoja de respuesta es más alta que la pantalla (texto muy grande en un celular chico), «Siguiente» se queda a la vista y lo demás se desplaza */
.sheet #nx{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);box-shadow:0 5px 0 var(--d),0 .9rem 0 .35rem var(--sheetbg)}
.sheet #nx:active:not(:disabled){box-shadow:0 1px 0 var(--d),0 .9rem 0 .35rem var(--sheetbg)}

/* ---- Escalera de la fe (v4.1): peldaño, puntos, seguro, porcentajes del público ---- */
.ladbar{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin:-.2rem 0 .8rem}
.ladbar span{padding:.28rem .65rem;border-radius:2rem;background:var(--panel);border:1px solid var(--line);font-size:.78rem;font-weight:800}
.ladbar .lv{background:linear-gradient(180deg,#ffd870,#f2a916);color:var(--goldink);border-color:transparent}
.ladbar .sf{border-color:var(--ok)}
.lad .dots{gap:2px}
.lad .dots i{max-width:1.4rem}
.lad .dots i.cur{box-shadow:0 0 0 2px var(--glow)}
.dots i.cp:not(.ok):not(.bad):not(.cur){background:rgba(240,176,34,.7)}
.lad .dots i.cp{height:.75rem;align-self:center}
.opt .pc{flex:none;margin-left:auto;padding:.12rem .55rem;border-radius:2rem;background:var(--gold);color:var(--goldink);font-size:.82rem;font-weight:900}
.opt.gone .pc{display:none}
#ret{display:flex;margin:.9rem auto 0;max-width:100%}
.sheet .lnote{margin:.1rem 0 .35rem;font-weight:700;font-size:.92rem}

/* ============================================================
   4.2 · MEJORA GRÁFICA
   Fondo con profundidad y estrellas, cabecera ilustrada, íconos propios, botones y tarjetas con relieve,
   tipografías incrustadas (Lora y Poppins) y brillos de festejo. Todo el movimiento se apaga con «reducir movimiento».
   ============================================================ */
body{background:radial-gradient(760px 440px at 50% -130px,var(--glow),transparent 70%),radial-gradient(520px 520px at 112% 12%,rgba(150,92,255,.2),transparent 70%),radial-gradient(560px 480px at -12% 104%,rgba(67,136,255,.22),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg0)) fixed;background-color:var(--bg0)}
body:after{content:"";position:fixed;inset:0 0 auto 0;height:250px;pointer-events:none;z-index:0;background-image:var(--stars-img);background-size:300px 300px;opacity:var(--star-op);animation:twk 7s ease-in-out infinite alternate;-webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.55) 110px,transparent 250px);mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.55) 110px,transparent 250px)}
@keyframes twk{from{opacity:calc(var(--star-op)*.5)}to{opacity:var(--star-op)}}
@keyframes twk2{from{opacity:.2}to{opacity:1}}
@keyframes hrot{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.gi{display:block;width:1.5rem;height:1.5rem;flex:none}
.gi .cut{fill:var(--tc,#333)}.gi .cutl{stroke:var(--tc,#333)}.gi .cutm{stroke:var(--tc,#333)}

/* ---- cabecera ilustrada del inicio ---- */
.hero{position:relative;isolation:isolate;overflow:hidden;margin:calc(-1*(env(safe-area-inset-top,0px) + .9rem)) -1rem -1.5rem;padding:calc(env(safe-area-inset-top,0px) + .9rem) 1rem 6.9rem;border-radius:0 0 1.9rem 1.9rem;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.hero .hart{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.hero .top{margin:0}
.hero .brand b{background:linear-gradient(90deg,var(--hb1),var(--hb2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.hero .brand img{border:1.5px solid rgba(255,255,255,.6);box-shadow:0 3px 12px rgba(0,0,0,.45)}
.hero .ibtn{background:var(--hbtn);border:1px solid var(--hbtnb);color:var(--hi);box-shadow:0 3px 10px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:grid;place-items:center}
.hero .ibtn .gi{width:1.3rem;height:1.3rem}
.hero .ibtn.hq{font:800 1.15rem/1 var(--f-btn)}
.hero+.card{position:relative;z-index:2;background:linear-gradient(160deg,var(--cs1),var(--cs2));box-shadow:0 12px 28px rgba(0,0,0,.32),inset 0 1px 0 var(--hl)}
.hst .tw,.hart>.tw{animation:twk2 3.2s ease-in-out infinite alternate}
.hst .tw.b,.hart>.tw.b{animation-duration:2.4s;animation-delay:-1.2s}
.hry{animation:hrot 38s ease-in-out infinite alternate}
@media (min-width:640px){.hero{margin-top:-2rem;padding-top:2rem}}

/* ---- tarjetas, fichas y niveles ---- */
.card{background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:var(--sh),inset 0 1px 0 var(--hl)}
.tile{background:linear-gradient(155deg,var(--g1),var(--g2));border-radius:1.3rem;box-shadow:0 8px 18px rgba(0,0,0,.2),inset 0 1px 0 var(--hl);overflow:hidden}
.tile:before{content:"";position:absolute;right:-1.7rem;top:-1.7rem;width:5.6rem;height:5.6rem;border-radius:50%;background:radial-gradient(circle,var(--tc),transparent 66%);opacity:.26;pointer-events:none}
.tile.wide:before{top:-2.4rem}
.tile>*{position:relative}
.tile .tag{position:absolute}
.tile .ic{width:2.95rem;height:2.95rem;border-radius:1.05rem;flex:none;background-color:var(--tc);background-image:linear-gradient(155deg,rgba(255,255,255,.48),rgba(255,255,255,0) 52%,rgba(0,0,0,.2));box-shadow:0 4px 0 rgba(0,0,0,.28),0 9px 14px rgba(0,0,0,.26),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12);color:#fff;transition:transform .15s}
.tile .ic .gi{width:1.75rem;height:1.75rem;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.3))}
.tile:active:not(:disabled) .ic{transform:scale(.9) rotate(-4deg)}
.tile b,.lv b,.tag,.pill,.chip{font-family:var(--f-btn)}
.tile b{font-weight:700;font-size:.95rem}
.tile small{font-size:.78rem}
.lv{background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 6px 14px rgba(0,0,0,.18),inset 0 1px 0 var(--hl)}
.lv i{height:2.2rem;display:grid;place-items:center;font-size:1.8rem}
.lv i .gi{width:2.1rem;height:2.1rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.lv:disabled i .gi{filter:grayscale(.5) opacity(.8)}
.pill{font-weight:600}.pill.on,.pill.gold{font-weight:700}

/* ---- botones ---- */
.btn{font-family:var(--f-btn)}
.btn:not(.ghost){background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 52%),linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--d),0 12px 20px rgba(0,0,0,.28),inset 0 1.5px 0 rgba(255,255,255,.42),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.sm:not(.ghost){box-shadow:0 4px 0 var(--d),inset 0 1.5px 0 rgba(255,255,255,.4)}
.btn.ghost{background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--hl)}

/* ---- pregunta y respuestas ---- */
.qcard{position:relative;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.75)}
.qcard:after{content:var(--wm,none);position:absolute;right:-.2rem;bottom:-.8rem;font-size:7.2rem;line-height:1;opacity:.12;transform:rotate(-10deg);pointer-events:none}
.qcard>*{position:relative;z-index:1}
.qhead{font-family:var(--f-btn);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 64%),linear-gradient(180deg,var(--cc),var(--ccd,var(--cc)))}
.qhead .qn{font-weight:500}
.dots i{height:.55rem}
.dots i.ok{background:linear-gradient(180deg,#6af0b0,var(--ok))}
.dots i.bad{background:linear-gradient(180deg,#ff9494,var(--bad))}
.dots i.cur{background:linear-gradient(180deg,#ffe699,var(--gold));box-shadow:0 0 0 3px var(--glow),0 0 12px var(--glow)}
.ring .pg{filter:drop-shadow(0 0 3px rgba(255,255,255,.65))}
.opt{font-family:var(--f-btn);font-weight:500;background:linear-gradient(180deg,var(--g1),var(--g2));border-radius:1.2rem;box-shadow:0 4px 0 rgba(0,0,0,.24),inset 0 1px 0 var(--hl)}
.opt>span:nth-child(2){flex:1;min-width:0}
.opt .ltr{width:2.25rem;height:2.25rem;border-radius:50%;font-family:var(--f-btn);background:radial-gradient(circle at 32% 26%,#fff0b8,var(--gold) 52%,var(--gold2));box-shadow:0 2px 0 var(--goldd),inset 0 1px 0 rgba(255,255,255,.7)}
.opt.ok{box-shadow:0 4px 0 #0f7a4a,0 0 26px rgba(47,191,126,.5)}
.opt.bad{box-shadow:0 4px 0 #8f1f25,0 0 24px rgba(239,90,90,.4)}
.opt.ok:after,.opt.bad:after{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;font:900 1rem/1 var(--f-ui);animation:pop .4s .1s both}
.opt.ok:after{content:"✓";background:#0b5a37;color:#fff}
.opt.bad:after{content:"✕";background:#fff;color:#a02027}
.lf{font-family:var(--f-btn);background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 1px 0 var(--hl);color:var(--ink)}
.lf span{display:grid;place-items:center;height:1.65rem;font-size:1.35rem;color:var(--gold)}
.lf .gi{width:1.5rem;height:1.5rem}
.kids .lf .gi{width:1.7rem;height:1.7rem}
.lf em{font-family:var(--f-btn);box-shadow:0 2px 0 var(--goldd)}

/* ---- hoja de respuesta ---- */
.sheet>div{box-shadow:0 -14px 40px rgba(0,0,0,.45),0 -10px 46px color-mix(in srgb,var(--sc) 32%,transparent)}
.sheet h3{font-size:1.4rem}
.sheet h3:before{content:"✓";flex:none;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--sc);color:var(--onok,#042515);font:900 1.05rem/1 var(--f-ui);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sheet.bad h3:before{content:"✕";color:#fff}
.sheet .verse{background:linear-gradient(135deg,var(--paper),var(--paper2));color:var(--paperink);border-left-color:var(--gold2);box-shadow:0 5px 16px rgba(0,0,0,.22)}
.sheet .verse small{color:var(--papermut)}
.sheet .verse a,.sheet .verse .vrv,.sheet .verse .vsh,.sheet .verse .vsp{color:#7a4f05}

/* ---- menú de abajo ---- */
.nav>div{box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 var(--hl);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav button{font-family:var(--f-btn);font-weight:600}
.nav button span{display:block;font-size:0;line-height:0;height:1.5rem}
.nav button .gi{width:1.5rem;height:1.5rem;margin:0 auto}
.nav button.on{background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),linear-gradient(180deg,#ffdf86,#f2a916);box-shadow:0 3px 0 #a86d07,0 8px 16px rgba(246,195,80,.32),inset 0 1px 0 rgba(255,255,255,.6)}
.nav .cutn{fill:var(--navbg)}.nav button.on .cutn{fill:#f6bf45}

/* ---- resultado: halo de luz detrás del trofeo ---- */
.res .trophy{position:relative;isolation:isolate;display:block;width:max-content;margin:0 auto;--hs:min(15rem,68vw);--hs2:min(9.5rem,60vw)}
.res .trophy:before{content:"";position:absolute;left:50%;top:50%;width:var(--hs);height:var(--hs);margin:calc(var(--hs)/-2) 0 0 calc(var(--hs)/-2);z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.46) 0 6deg,transparent 6deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 14%,transparent 68%);mask-image:radial-gradient(circle,#000 14%,transparent 68%);animation:spin 30s linear infinite}
.res .trophy:after{content:"";position:absolute;left:50%;top:50%;width:var(--hs2);height:var(--hs2);margin:calc(var(--hs2)/-2) 0 0 calc(var(--hs2)/-2);z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(255,234,160,.6),transparent 68%)}
.score{font-family:var(--f-disp);font-weight:700}
.chip{font-weight:600}
/* ---- logros y barra de nivel ---- */
.md.on{background:radial-gradient(circle at 50% 26%,rgba(246,195,80,.3),transparent 62%),linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 0 0 1px rgba(246,195,80,.4),0 8px 18px rgba(0,0,0,.2),inset 0 1px 0 var(--hl)}
.md.on i{filter:drop-shadow(0 3px 6px rgba(246,195,80,.6))}
.xp{height:.7rem;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.xp i{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 60%),linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 10px var(--glow)}
/* ---- 4.3 · amigos, invitaciones de un toque y chat de la sala ---- */
.fcard{text-align:center}
.fcard>small{color:var(--mut);font-weight:700;font-size:.82rem}
.fcode{font-family:var(--f-disp);font-size:min(2.1rem,8vw);font-weight:900;letter-spacing:.08em;color:var(--goldtxt);margin:.3rem 0 .85rem;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.fcard .two .btn{min-width:0}
.flist{padding:.25rem .9rem}
.frow{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .6rem;padding:.65rem 0}
.frow+.frow{border-top:1px solid var(--line)}
.frow .av{width:2.4rem;height:2.4rem;flex:none;font-size:1rem;border-width:2px}
.frow .fi{flex:1 1 5rem;min-width:0}
.frow .fi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fi small{display:block;color:var(--mut);font-size:.78rem;font-weight:700;line-height:1.3}
.frow .fi small.on{color:var(--ok)}
.frow .btn.sm{width:auto;flex:none;min-height:2.4rem;padding:.35rem .75rem;font-size:.9rem;margin:0}
.frow .ibtn{width:2.2rem;height:2.2rem;font-size:.8rem}
#frs{max-height:44vh;overflow-y:auto;margin:0 -.3rem;padding:0 .3rem;overscroll-behavior:contain}
#frs .h2{font-size:1rem;margin:.9rem 0 .4rem}
#frs .card{padding:.1rem .7rem;box-shadow:none}
.md2 .fcode{text-align:center}
/* cartel de aviso (pedido de amistad o invitación a jugar) */
#invb{position:fixed;left:.6rem;right:.6rem;top:calc(env(safe-area-inset-top,0px) + .5rem);z-index:47;max-width:29rem;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .6rem;padding:.6rem .7rem;border-radius:1.2rem;background:var(--sheetbg);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.45);animation:invin .35s both}
#invb .ie{font-size:1.6rem;line-height:1;flex:none}
#invb>div{flex:1 1 6rem;min-width:0}
#invb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#invb small{display:block;color:var(--mut);font-size:.78rem;font-weight:700}
#invb .btn.sm{width:auto;flex:none;min-height:2.4rem;padding:.35rem .85rem;font-size:.9rem;margin:0}
#invb .ibtn{width:2.2rem;height:2.2rem;font-size:.8rem}
@keyframes invin{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
/* en la sala: agregar o ver que ya es amigo */
.addf{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid var(--gold);background:var(--panel2);display:grid;place-items:center;color:var(--goldtxt)}
.addf svg{width:1rem;height:1rem;display:block}
.addf:active{transform:scale(.9)}
.isf{flex:none;font-size:1.05rem;line-height:1}
.tcol .prow .addf{width:1.8rem;height:1.8rem}.tcol .prow .addf svg{width:.8rem;height:.8rem}
.tcol .prow .isf{font-size:.9rem}
/* globito con el número de mensajes sin leer */
.chb{position:relative}
.bdg{font-style:normal;min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:1rem;background:var(--bad);color:#fff;font:800 .72rem/1.2rem var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--sheetbg)}
.bdg[hidden]{display:none}
.ibtn .bdg{position:absolute;top:-.3rem;right:-.3rem}
.btn .bdg{margin-left:.2rem;box-shadow:none}
/* chat */
.chcard{margin-top:1rem;padding:.8rem}
.chat{display:flex;flex-direction:column;min-height:0}
.chh b{font-family:var(--f-disp);font-size:1.02rem}
.chlist{overflow-y:auto;overscroll-behavior:contain;max-height:11.5rem;min-height:5.5rem;margin:.5rem 0;padding:.15rem;display:flex;flex-direction:column;gap:.35rem}
.chm{align-self:flex-start;max-width:88%;padding:.4rem .7rem;border-radius:1rem 1rem 1rem .3rem;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--avc,var(--line));font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
.chm b{display:block;font-size:.76rem;color:var(--mut);margin-bottom:.05rem}
.chm.me{align-self:flex-end;background:var(--gold);color:var(--goldink);border-color:transparent;border-radius:1rem 1rem .3rem 1rem}
.chm.me b{color:inherit;opacity:.8}
.chempty{color:var(--mut);text-align:center;font-size:.86rem;margin:auto 0}
.chnote{font-size:.78rem;color:var(--mut);margin:0 0 .4rem}
.chh,.chnote,.chf{flex:none}
.chq{display:flex;flex:none;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding:.15rem 0 .5rem}
.chq::-webkit-scrollbar{display:none}
.chq .pill{flex:none;font-size:.8rem;padding:.35rem .7rem}
.chf{display:flex;gap:.5rem;align-items:center}
.chi{flex:1;min-width:0;margin:0!important}
.chs{flex:none;width:2.9rem;height:2.9rem;border-radius:50%;background:linear-gradient(180deg,#ffd870,#f2a916);color:var(--goldink);font-size:1.1rem;font-weight:900;box-shadow:0 3px 0 #a86d07,inset 0 1.5px 0 rgba(255,255,255,.45);display:grid;place-items:center}
.chs:active{transform:translateY(2px);box-shadow:0 1px 0 #a86d07}
#chov{position:fixed;inset:0;z-index:45;background:rgba(3,8,25,.5);animation:fade .2s both}
#chp{position:fixed;left:.6rem;right:.6rem;top:calc(env(safe-area-inset-top,0px) + .5rem);max-width:30rem;margin:0 auto;z-index:46;display:flex;flex-direction:column;background:var(--sheetbg);color:var(--ink);border:1px solid var(--line);border-radius:1.4rem;box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden;animation:pop .22s both}
#chp header{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem .5rem 1rem;border-bottom:1px solid var(--line);flex:none}
#chp header b{flex:1;font-family:var(--f-disp)}
#chp .chbody{padding:.4rem .8rem .8rem;display:flex;flex-direction:column;min-height:0;flex:1}
#chp .chat{min-height:0;flex:1}
#chp .chlist{flex:1 1 auto;max-height:none;min-height:4rem}
html.xbig .chlist{max-height:9rem}
/* equipos en la sala: las columnas nunca se salen de la tarjeta (nombres largos + botón ➕); en pantallas chicas o con letra grande quedan una arriba de la otra */
.teamsel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tcol{min-width:0}
.tcol .prow .addf,.tcol .prow .isf{flex:none}
@media (max-width:400px){.teamsel{grid-template-columns:minmax(0,1fr)}}
html.big .teamsel,html.xbig .teamsel{grid-template-columns:minmax(0,1fr)}
#chp.short .chq{display:none}
#chp.short .chlist{min-height:2.4rem;margin:.3rem 0}
/* nombre del jugador en la sala: si es largo se corta con «…» pero el «(tú)» siempre se ve */
.prow b.pn{display:flex;min-width:0}
.prow b.pn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow b.pn i{flex:none;font-style:normal;white-space:pre}
/* barra de arriba de la partida: con letra grande los botones se achican para que entren ✕, 😀 y 💬 sin salirse */
.gtop .ttl{min-width:0;overflow-wrap:anywhere}
html.big .gtop .ibtn{width:2.3rem;height:2.3rem;font-size:1rem}
html.xbig .gtop .ibtn{width:2rem;height:2rem;font-size:.9rem}
html.big .gtop,html.xbig .gtop{gap:.5rem}
/* leyenda de la ruleta: las etiquetas no se salen de la pantalla con letra grande */
.legend{grid-template-columns:repeat(3,minmax(0,1fr))}
.legend span{min-width:0;overflow-wrap:anywhere}
html.big .legend,html.xbig .legend{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---- Adivina el personaje (v4.4) ---- */
.q.who{font-family:var(--f-ui);font-size:1rem;line-height:1.45;font-weight:600;text-align:left;margin:.75rem 1.05rem 0}
.q.who .whh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem .6rem;margin-bottom:.5rem;font-size:.8rem;font-weight:800;letter-spacing:.01em}
.q.who .whh span{opacity:.78}
.q.who .whh b{padding:.18rem .6rem;border-radius:2rem;background:linear-gradient(180deg,#ffd870,#f2a916);color:var(--goldink);font-size:.76rem;white-space:nowrap}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.clues li{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem .6rem;border-radius:.8rem;background:rgba(120,120,120,.12);background:color-mix(in srgb,var(--cc) 10%,transparent);border:1px solid rgba(120,120,120,.2);overflow-wrap:anywhere}
.clues li i{flex:none;display:grid;place-items:center;width:1.35rem;height:1.35rem;margin-top:.08rem;border-radius:50%;background:var(--cc);color:var(--on);font-style:normal;font-size:.75rem;font-weight:800}
.clues li span{min-width:0}
.clues li.new{animation:in .25s ease-out both}
.clues li.off{opacity:.62}
.clues li.off i{background:rgba(120,120,120,.55);color:#fff}
#clue{width:100%;margin:.7rem 0 0}
@media (prefers-reduced-motion:reduce){.clues li.new{animation:none}}

/* Torneo con amigos (v4.4) */
.seg.s4{flex-wrap:wrap}
.seg.s4 button{flex:1 1 45%}
.mdd{margin:.55rem .2rem 0;font-size:.84rem;line-height:1.35;min-height:2.7em}
.trh{text-align:center;margin:.2rem 0 .7rem}
.trh i{display:block;font-style:normal;font-size:2.5rem;line-height:1.1;animation:pop .5s both}
.trh h1,.trh h2{font-family:var(--f-disp);font-size:1.45rem;line-height:1.2;margin:.25rem 0 .15rem;overflow-wrap:anywhere}
.trh p{margin:0;color:var(--mut);font-size:.9rem}
.trb,.trf{padding:.4rem .9rem .6rem;text-align:left}
.trf{margin:.6rem 0}
.trf .trh{margin-top:.5rem}
.trr{display:flex;align-items:center;gap:.55rem;padding:.55rem 0;font-weight:700}
.trr+.trr{border-top:1px solid var(--line)}
.trr .trk{flex:none;width:2rem;text-align:center;font-size:1.35rem;line-height:1}
.trr .mav{margin:0;width:2rem;height:2rem;font-size:.85rem;top:0}
.trr .trn{flex:1;min-width:0;display:flex;flex-direction:column}
.trr .trn>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trr .trn small{color:var(--mut);font-weight:600;font-size:.76rem;line-height:1.3}
.trr>b{flex:none;font-family:var(--f-disp);font-size:1.2rem}
.trr.me .trn>span,.trr.me>b{color:var(--goldtxt)}
.trr.wait{opacity:.75}
.trw{text-align:center;margin:.9rem 0 .7rem}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:.45rem;margin:.5rem 0 .8rem}
.pd{flex:1 1 0;max-width:7.6rem;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pd .pdc{height:1.3rem;font-size:1.1rem;line-height:1.3rem}
.pd .mav{width:2.7rem;height:2.7rem;font-size:1.1rem;margin:0 0 .2rem;top:0}
.pd .pn{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:.85rem}
.pd .pp{font-family:var(--f-disp);font-weight:800;font-size:1.05rem;color:var(--goldtxt)}
.pd .pb{width:100%;display:grid;place-items:center;margin-top:.3rem;border-radius:.8rem .8rem 0 0;font-size:1.7rem;transform-origin:bottom;animation:rise .7s both}
.pd.p1 .pb{height:5.4rem;background:linear-gradient(180deg,#fbdc78,#d9970f)}
.pd.p2 .pb{height:4rem;background:linear-gradient(180deg,#e9edf5,#9aa3b8)}
.pd.p3 .pb{height:3rem;background:linear-gradient(180deg,#e6ae80,#a8612b)}
@keyframes rise{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}

/* Tarjeta del versículo (v4.4): «Compartir como imagen» y «Escuchar el versículo» eran renglones de 20 px; ahora el toque cubre unos 38 px de alto sin mover el texto */
.nw{white-space:nowrap}
.verse .vsh,.verse .vsp{margin-top:0;padding:.55rem 0;min-height:2.4rem;display:flex;align-items:center}
.verse a,.verse .vrv{margin-top:0;padding:.55rem 0;min-height:2.4rem}
/* v4.4: los 4 botones de modo (2 por fila) tienen más alto para tocarlos bien en celulares angostos */
.seg.s4 button{min-height:2.8rem}

/* ============ v4.5 · MÁS COLOR Y MÁS ESCENAS ============ */
/* Fichas del inicio: cada modo tiene su color (un velo en la esquina, borde de luz y un «escalón» de color abajo, como los niveles) */
.tile{--tr:67,136,255;border:1px solid rgba(var(--tr),.4);border-bottom:4px solid var(--tc);
  background:radial-gradient(125% 100% at 100% 0%,rgba(var(--tr),.36),transparent 62%),radial-gradient(90% 70% at 0% 105%,rgba(var(--tr),.14),transparent 70%),linear-gradient(155deg,var(--g1),var(--g2));
  box-shadow:0 8px 18px rgba(0,0,0,.2),0 0 24px -8px rgba(var(--tr),.55),inset 0 1px 0 var(--hl)}
.tile:before{display:none}
.tile .ic{box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 18px rgba(var(--tr),.5),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12)}
.tile:active:not(:disabled){transform:translateY(2px) scale(.985);border-bottom-width:2px;margin-bottom:2px}
.tile:disabled{border-bottom-color:rgba(var(--tr),.45)}

/* Logros: cada medalla es un medallón (aro metálico + esmalte + brillo); las ganadas tienen aro de oro y resplandor */
:root{--mde1:#33407f;--mde2:#171f52;--mdr1:#9aa4cf;--mdr2:#4c5788}
.md{position:relative}
.md i{position:relative;width:3.7rem;height:3.7rem;margin:0 auto .3rem;border-radius:50%;display:grid;place-items:center;font-size:1.75rem;line-height:1;border:3px solid transparent;
  background:radial-gradient(circle at 50% 30%,var(--mde1),var(--mde2)) padding-box,linear-gradient(150deg,var(--mdr1),var(--mdr2) 55%,var(--mdr1)) border-box;box-shadow:0 5px 10px rgba(0,0,0,.28),inset 0 -3px 6px rgba(0,0,0,.28)}
.md i:after{content:"";position:absolute;left:13%;top:7%;width:50%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));transform:rotate(-24deg);pointer-events:none}
.md.on i{background:radial-gradient(circle at 50% 30%,var(--mde1),var(--mde2)) padding-box,linear-gradient(150deg,#fff3c0,#f3b92f 42%,#b9780b 78%,#f7d982) border-box;box-shadow:0 0 0 3px rgba(246,195,80,.2),0 7px 16px rgba(246,195,80,.42),inset 0 -3px 6px rgba(0,0,0,.28);filter:none}
.md.off i{filter:grayscale(1)}

/* Escenas de fondo de la pantalla de pregunta: siluetas del color del bloque que llenan la parte de abajo (se desvanecen hacia arriba) */
:root{--h0:#4a4aa4;--cl:#fff;--clo:.06}
:root{--s-f:.21;--s-m:.27;--s-n:.62;--s-w:.5;--s-wf:#fff4d4}
#bgs{position:fixed;left:0;right:0;bottom:0;height:min(64vw,350px);z-index:0;pointer-events:none;opacity:0;transition:opacity .45s;-webkit-mask-image:linear-gradient(0deg,#000 58%,transparent);mask-image:linear-gradient(0deg,#000 58%,transparent)}
#bgs.on{opacity:1}
#bgs.on.dim{opacity:.28}
#bgs svg{display:block;width:100%;height:100%}
#bgs .f,.bkh .f{fill:var(--ccl);opacity:var(--s-f)}
#bgs .m,.bkh .m{fill:var(--cc);opacity:var(--s-m)}
#bgs .n,.bkh .n{fill:var(--ccd);opacity:var(--s-n)}
#bgs .g,.bkh .g{fill:#ffe49a}
#bgs .w,.bkh .w{fill:var(--s-wf);opacity:var(--s-w)}
#bgs .s,.bkh .s{fill:none;stroke:var(--ccd);opacity:var(--s-n)}
/* Mapa de la Biblia: cada bloque abre con su escena (la misma de la pantalla de pregunta) */
.h2.bkh{position:relative;isolation:isolate;overflow:hidden;border-radius:1.15rem;align-items:flex-end;margin:1.4rem 0 .7rem;padding:3.1rem .95rem .7rem;border:1px solid var(--line);border-bottom:3px solid var(--cc);background:var(--panel);font-size:1.25rem}
.bkh svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;display:block}
.bkh>span,.bkh>small{position:relative}
@media (prefers-reduced-motion:reduce){#bgs{transition:none}}
.res{padding-top:1.7rem}

/* Resultado: la copa va dentro de una corona de laurel y las estrellas son doradas con facetas (la 2.ª, más grande y más alta) */
:root{--soff1:rgba(255,255,255,.1);--soff2:rgba(255,255,255,.05);--soffr:rgba(255,255,255,.28)}
.res .trophy:before{z-index:-3}
.res .trophy:after{z-index:-2}
.res .trophy{margin-bottom:1.5rem}
.res .trophy .lau{position:absolute;left:50%;top:50%;width:10.8rem;height:auto;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;overflow:visible}
.res .trophy.dim .lau{filter:grayscale(.85) opacity(.5)}
.stars{align-items:flex-end;gap:.3rem;margin:.15rem 0 .1rem;font-size:0}
.stars span{display:block;line-height:0;filter:none}
.stars svg{display:block;width:3.1rem;height:3.1rem;overflow:visible}
.stars span:nth-child(2){margin-bottom:.6rem}
.stars span:nth-child(2) svg{width:3.9rem;height:3.9rem}
.stars .sa{fill:var(--soff1)}.stars .sb{fill:var(--soff2)}
.stars .sr{fill:none;stroke:var(--soffr);stroke-width:1.4;stroke-linejoin:round}
.stars span.on .sa{fill:#ffe07a}.stars span.on .sb{fill:#f0aa1c}
.stars span.on .sr{stroke:#a46603;stroke-width:1.7}
.stars span.on svg{filter:drop-shadow(0 3px 0 rgba(120,68,0,.55)) drop-shadow(0 0 12px rgba(246,195,80,.55))}

/* ---- Compañeros (v4.6): Lanita, Paloma y Leo ---- */
.mc{display:inline-block;width:var(--mcs,4.4rem);height:var(--mcs,4.4rem);flex:none;vertical-align:middle;transform-origin:50% 88%;pointer-events:none}
.mc svg{display:block;width:100%;height:100%}
button.mc{pointer-events:auto;cursor:pointer;padding:0;background:none;-webkit-tap-highlight-color:transparent}
@keyframes mchop{0%{transform:none}28%{transform:translateY(-16%) scale(1.05,.98)}52%{transform:scale(.97,1.04)}72%{transform:translateY(-6%)}100%{transform:none}}
@keyframes mcsag{0%{transform:none}40%{transform:translateY(6%) scale(1.04,.93)}100%{transform:translateY(2%) scale(1,.98)}}
@keyframes mcin{0%{transform:scale(.4) translateY(14%);opacity:0}100%{transform:none;opacity:1}}
.mc.hop{animation:mchop .8s ease-out}
.mc.sag{animation:mcsag .6s ease-out forwards}
.mc.in{animation:mcin .5s cubic-bezier(.2,1.5,.4,1) both}
/* hoja de respuesta: el compañero va a la derecha del título y la respuesta */
.shh{display:flex;align-items:flex-start;gap:.5rem}
.shh .shm{flex:1;min-width:0}
.shh .mc{--mcs:3.7rem;margin:-.25rem 0 -.2rem}
.sheet.kid .shh .mc{--mcs:4.8rem}
/* inicio: fila con el compañero y su globito */
.mcrow{display:flex;align-items:center;gap:.7rem;margin-top:.9rem}
.mcrow .mc{--mcs:5rem}
.mcrow .bub{position:relative;flex:1;min-width:0;padding:.6rem .85rem .65rem;border-radius:1.2rem;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer}
.mcrow .bub:before{content:"";position:absolute;left:-.42rem;top:1.35rem;width:.8rem;height:.8rem;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 .2rem}
.mcrow .bub b{display:block;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--goldtxt)}
.mcrow .bub p{margin:.1rem 0 0;font-size:.95rem;line-height:1.35;color:var(--ink)}
/* resultado: el compañero al lado del trofeo (se mueve con él) */
.res .trophy .mc.rs{position:absolute;left:calc(50% + min(5rem,22vw));bottom:-.7rem;--mcs:min(4.4rem,21vw)}
/* Ajustes: selector de compañero */
.mcpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem;margin-top:.7rem}
html.big .mcpick,html.xbig .mcpick{grid-template-columns:repeat(2,minmax(0,1fr))}
.mcpick button{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.45rem .2rem .5rem;border-radius:1rem;background:var(--panel);border:2px solid transparent;color:var(--mut);font-size:.8rem;min-height:5.6rem}
.mcpick button.on{border-color:var(--gold);background:var(--panel2);color:var(--ink)}
.mcpick .mc{--mcs:3.4rem}
.mcpick .mcx{display:grid;place-items:center;width:3.4rem;height:3.4rem;font-size:1.7rem;opacity:.7}
.mcpick b{font-size:.82rem;overflow-wrap:anywhere;text-align:center}

</style>
</head>

/* corona de laurel que rodea la copa de la pantalla de resultado: dos ramas de hojas doradas y un moño rojo (se arma por código, una sola vez) */
let LAUREL="";
function laurelArt(){
  if(LAUREL)return LAUREL;
  const cx=100,cy=84,rx=66,ry=58,pt=t=>[cx+rx*Math.cos(t),cy+ry*Math.sin(t)];let out="",inn="";
  for(let k=0;k<10;k++){
    const t=(98+k*16.4)*Math.PI/180,[x,y]=pt(t),ta=Math.atan2(ry*Math.cos(t),-rx*Math.sin(t))*180/Math.PI,s=1.1-k*.04,nx=Math.cos(t),ny=Math.sin(t);
    const lf=(px,py,a)=>`<path d="M0 0Q${(6*s).toFixed(1)} ${(-4.8*s).toFixed(1)} ${(15*s).toFixed(1)} 0Q${(6*s).toFixed(1)} ${(4.8*s).toFixed(1)} 0 0Z" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${a.toFixed(1)})"/>`;
    out+=lf(x+nx*5,y+ny*5,ta-30);inn+=lf(x-nx*5,y-ny*5,ta+30)}
  const [x0,y0]=pt(96*Math.PI/180),[x1,y1]=pt(254*Math.PI/180);
  const br=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${rx} ${ry} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#b7790f" stroke-width="2.6" stroke-linecap="round"/><g fill="#f6cf58" stroke="#a8690a" stroke-width=".8" stroke-linejoin="round">${out}</g><g fill="#dd9f1c" stroke="#a8690a" stroke-width=".8" stroke-linejoin="round">${inn}</g>`;
  LAUREL=`<svg class="lau" viewBox="0 0 200 182" aria-hidden="true" focusable="false"><g>${br}</g><g transform="matrix(-1 0 0 1 200 0)">${br}</g><g fill="#e24b4b" stroke="#9c2323" stroke-width="1.1" stroke-linejoin="round"><path d="M97 152L85 171L93 168L97 175L103 156Z"/><path d="M103 152L115 171L107 168L103 175L97 156Z"/><circle cx="100" cy="151" r="6"/></g><circle cx="98.2" cy="149.2" r="1.8" fill="#fff" opacity=".5"/></svg>`;
  return LAUREL}

/* estrella dorada con facetas para las estrellas del resultado; los colores salen del CSS (.sa .sb .sr) y por eso la misma estrella sirve «apagada» */
let STAR="";
function starArt(){
  if(STAR)return STAR;
  const P=[];for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,r=i%2?6.6:14.6;P.push([16+r*Math.cos(a),17+r*Math.sin(a)])}
  const f=(a,b,i)=>`<path class="${i%2?"sb":"sa"}" d="M16 17L${a[0].toFixed(2)} ${a[1].toFixed(2)}L${b[0].toFixed(2)} ${b[1].toFixed(2)}Z"/>`;
  STAR=`<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">${P.map((p,i)=>f(p,P[(i+1)%10],i)).join("")}<polygon class="sr" points="${P.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" ")}"/></svg>`;
  return STAR}

let GID="bgg"; /* cada dibujo lleva su propio id de degradado (la misma escena sale también en el Mapa) */
